###############################################################################
# OPTION A — Metricbeat (Self-Monitoring)
#
# Deploys Metricbeat via ECK Beat CRD as a DaemonSet:
#   - System module: CPU, memory, disk, network on EVERY GKE node
#   - Elasticsearch module: cluster, node, index, shard stats
#   - Kibana module: Kibana instance stats
#
# Ships metrics to the SAME Elasticsearch cluster.
# Dashboards auto-loaded into Kibana on startup.
#
# SCHEDULING:
#   DaemonSet runs on ALL nodes (system, master, data).
#   Must tolerate ES pool taints to collect metrics from those nodes.
###############################################################################
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: metricbeat
  namespace: elastic-stack
  labels:
    app.kubernetes.io/part-of: elastic-stack
    app.kubernetes.io/component: monitoring
spec:
  type: metricbeat
  version: 9.1.3
  elasticsearchRef:
    name: elasticsearch
    namespace: elastic-stack
  kibanaRef:
    name: kibana
    namespace: elastic-stack

  config:
    # ── System metrics (every node) ──
    metricbeat.modules:
      - module: system
        period: 30s
        metricsets:
          - cpu
          - load
          - memory
          - network
          - process
          - process_summary
          - socket_summary
          - filesystem
          - fsstat
        process.include_top_n:
          by_cpu: 10
          by_memory: 10
        processes: ['.*']

      - module: system
        period: 1m
        metricsets:
          - diskio
        processors:
          - drop_event.when.regexp:
              system.diskio.name: '^(ram|loop|fd).*'

      # ── Elasticsearch metrics ──
      - module: elasticsearch
        period: 30s
        hosts: ["http://elasticsearch-es-http.elastic-stack.svc:9200"]
        username: "${MONITORED_ES_USERNAME}"
        password: "${MONITORED_ES_PASSWORD}"
        xpack.enabled: true
        metricsets:
          - node
          - node_stats
          - cluster_stats
          - index
          - index_summary
          - index_recovery
          - shard
          - pending_tasks
          - enrich

      - module: elasticsearch
        period: 5m
        hosts: ["http://elasticsearch-es-http.elastic-stack.svc:9200"]
        username: "${MONITORED_ES_USERNAME}"
        password: "${MONITORED_ES_PASSWORD}"
        xpack.enabled: true
        metricsets:
          - ml_job

      # ── Kibana metrics ──
      - module: kibana
        period: 30s
        hosts: ["http://kibana-kb-http.elastic-stack.svc:5601"]
        username: "${MONITORED_ES_USERNAME}"
        password: "${MONITORED_ES_PASSWORD}"
        xpack.enabled: true
        metricsets:
          - stats
          - status

    # ── Processors ──
    processors:
      - add_cloud_metadata: {}
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          scope: node
      - add_host_metadata:
          netinfo.enabled: true

    # ── Output (same cluster) ──
    output.elasticsearch:
      hosts: ["http://elasticsearch-es-http.elastic-stack.svc:9200"]
      username: "${MONITORED_ES_USERNAME}"
      password: "${MONITORED_ES_PASSWORD}"

    # ── Dashboards ──
    setup.dashboards.enabled: true
    setup.kibana:
      host: "http://kibana-kb-http.elastic-stack.svc:5601"

  daemonSet:
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/part-of: elastic-stack
          app.kubernetes.io/component: metricbeat
      spec:
        serviceAccountName: metricbeat
        automountServiceAccountToken: true
        # Run on ALL nodes — including tainted ES pools
        tolerations:
          - key: "elastic.co/role"
            operator: "Exists"
            effect: "NoSchedule"
        containers:
          - name: metricbeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: MONITORED_ES_USERNAME
                value: "elastic"
              - name: MONITORED_ES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: elasticsearch-es-elastic-user
                    key: elastic
            resources:
              requests:
                memory: 300Mi
                cpu: 100m
              limits:
                memory: 500Mi
                cpu: 200m
            volumeMounts:
              - name: proc
                mountPath: /hostfs/proc
                readOnly: true
              - name: sys
                mountPath: /hostfs/sys
                readOnly: true
              - name: root
                mountPath: /hostfs
                readOnly: true
        volumes:
          - name: proc
            hostPath:
              path: /proc
          - name: sys
            hostPath:
              path: /sys
          - name: root
            hostPath:
              path: /

---
###############################################################################
# RBAC — Metricbeat needs kube-state-metrics access
###############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metricbeat
  namespace: elastic-stack

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metricbeat-cluster-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metricbeat-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metricbeat-cluster-role
subjects:
  - kind: ServiceAccount
    name: metricbeat
    namespace: elastic-stack
