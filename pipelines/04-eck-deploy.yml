# Pipeline: ECK Deploy
# Deploys ECK operator, Elasticsearch, Kibana, snapshots, index settings
# Syncs Kibana credentials to GCP Secret Manager

trigger: none

parameters:
  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

  - name: clusterName
    displayName: 'GKE Cluster Name'
    type: string

  - name: esDataJvmHeap
    displayName: 'ES Data Node JVM Heap (e.g. 16g, 8g)'
    type: string
    default: '16g'

  - name: esMasterJvmHeap
    displayName: 'ES Master Node JVM Heap (e.g. 4g, 2g)'
    type: string
    default: '4g'

variables:
  - group: gcp-credentials-${{ parameters.project }}
  # Variable group must contain:
  #   GCP_SA_KEY            - GCP Service Account Key JSON
  #   GCP_PROJECT_ID        - GCP Project ID
  #   KIBANA_ENCRYPTION_KEY - 32+ char random string (openssl rand -base64 32)
  - name: ES_CLUSTER_NAME
    value: elastic-prod
  # GCS bucket name auto-derived from GKE cluster name: {clusterName}-snapshot-bucket
  - name: GCS_BUCKET_NAME
    value: ${{ parameters.clusterName }}-snapshot-bucket
  - name: ES_VERSION
    value: '9.1.3'
  - name: ECK_OPERATOR_VERSION
    value: '9.1.3'
  - name: CLUSTER_LOCATION
    value: us-east1
  - name: SNAPSHOT_REPO_NAME
    value: gcs-snapshots
  - name: SNAPSHOT_BASE_PATH
    value: es-snapshots
  - name: SLM_POLICY_NAME
    value: daily-snapshots

pool:
  vmImage: 'ubuntu-latest'

stages:
  # Stage 1: Connect to GKE and deploy ECK operator
  - stage: ECK_Operator
    displayName: 'Deploy ECK Operator'
    jobs:
      - job: DeployOperator
        displayName: 'ECK Operator'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install GKE Auth Plugin & Authenticate'
            inputs:
              targetType: inline
              script: |
                # Install gke-gcloud-auth-plugin (required for kubectl auth with GKE)
                sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-sdk-gke-gcloud-auth-plugin
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "##vso[task.setvariable variable=USE_GKE_GCLOUD_AUTH_PLUGIN]True"

                echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json
                gcloud auth activate-service-account --key-file=$(Agent.TempDirectory)/gcp-key.json
                gcloud container clusters get-credentials ${{ parameters.clusterName }} \
                  --region $(CLUSTER_LOCATION) \
                  --project $(GCP_PROJECT_ID)

          - task: Bash@3
            displayName: 'Create Namespaces'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "Creating namespaces (idempotent - safe to re-run)..."
                kubectl apply -f $(System.DefaultWorkingDirectory)/eck/00-namespaces.yaml

          - task: Bash@3
            displayName: 'Install ECK CRDs'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl apply --server-side -f https://download.elastic.co/downloads/eck/$(ECK_OPERATOR_VERSION)/crds.yaml

          - task: Bash@3
            displayName: 'Install ECK Operator'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl apply -f https://download.elastic.co/downloads/eck/$(ECK_OPERATOR_VERSION)/operator.yaml

          - task: Bash@3
            displayName: 'Apply Enterprise Trial License'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl apply -f $(System.DefaultWorkingDirectory)/eck/01-enterprise-license.yaml

          - task: Bash@3
            displayName: 'Wait for ECK Operator Ready'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl -n elastic-system wait --for=condition=available deployment/elastic-operator --timeout=300s

  # Stage 2: Deploy Elasticsearch and Kibana
  - stage: ECK_Stack
    displayName: 'Deploy Elasticsearch & Kibana'
    dependsOn: ECK_Operator
    jobs:
      - job: DeployStack
        displayName: 'Elastic Stack'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install GKE Auth Plugin & Authenticate'
            inputs:
              targetType: inline
              script: |
                sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-sdk-gke-gcloud-auth-plugin
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "##vso[task.setvariable variable=USE_GKE_GCLOUD_AUTH_PLUGIN]True"

                echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json
                gcloud auth activate-service-account --key-file=$(Agent.TempDirectory)/gcp-key.json
                gcloud container clusters get-credentials ${{ parameters.clusterName }} \
                  --region $(CLUSTER_LOCATION) \
                  --project $(GCP_PROJECT_ID)

          # Create GCS bucket for snapshots (idempotent - skips if exists)
          - task: Bash@3
            displayName: 'Create GCS Snapshot Bucket'
            inputs:
              targetType: inline
              script: |
                BUCKET_NAME="$(GCS_BUCKET_NAME)"
                echo "Checking if GCS bucket gs://${BUCKET_NAME} exists..."
                if gcloud storage buckets describe "gs://${BUCKET_NAME}" --project=$(GCP_PROJECT_ID) &>/dev/null; then
                  echo "Bucket gs://${BUCKET_NAME} already exists. Skipping creation."
                else
                  echo "Creating bucket gs://${BUCKET_NAME}..."
                  gcloud storage buckets create "gs://${BUCKET_NAME}" \
                    --project=$(GCP_PROJECT_ID) \
                    --location=$(CLUSTER_LOCATION) \
                    --uniform-bucket-level-access
                  echo "Bucket gs://${BUCKET_NAME} created successfully."
                fi

          # Create GCS credentials secret from service account key
          - task: Bash@3
            displayName: 'Create GCS Credentials Secret'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcs-key.json
                kubectl create secret generic gcs-credentials \
                  --from-file=gcs.client.default.credentials_file=$(Agent.TempDirectory)/gcs-key.json \
                  -n elastic-stack --dry-run=client -o yaml | kubectl apply -f -

          - task: Bash@3
            displayName: 'Apply Synonyms ConfigMap'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl apply -f $(System.DefaultWorkingDirectory)/eck/03-synonyms-configmap.yaml

          # Apply Elasticsearch manifest with variable substitution
          - task: Bash@3
            displayName: 'Deploy Elasticsearch'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                export ES_VERSION="$(ES_VERSION)"
                export ES_MASTER_JVM_HEAP="${{ parameters.esMasterJvmHeap }}"
                export ES_DATA_JVM_HEAP="${{ parameters.esDataJvmHeap }}"
                envsubst < $(System.DefaultWorkingDirectory)/eck/04-elasticsearch.yaml | kubectl apply -f -

          - task: Bash@3
            displayName: 'Deploy Kibana'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                export ES_VERSION="$(ES_VERSION)"
                export KIBANA_EXTERNAL_HOST="kibana.${{ parameters.project }}.example.com"
                export KIBANA_ENCRYPTION_KEY="$(KIBANA_ENCRYPTION_KEY)"
                export KIBANA_SAVED_OBJECTS_KEY="$(KIBANA_ENCRYPTION_KEY)"
                export KIBANA_REPORTING_KEY="$(KIBANA_ENCRYPTION_KEY)"
                envsubst < $(System.DefaultWorkingDirectory)/eck/05-kibana.yaml | kubectl apply -f -

          - task: Bash@3
            displayName: 'Wait for Elasticsearch Ready'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "Waiting for Elasticsearch to become green..."
                kubectl -n elastic-stack wait --for=jsonpath='{.status.health}'=green \
                  elasticsearch/$(ES_CLUSTER_NAME) --timeout=600s
            timeoutInMinutes: 12

          - task: Bash@3
            displayName: 'Wait for Kibana Ready'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "Waiting for Kibana to become green..."
                kubectl -n elastic-stack wait --for=jsonpath='{.status.health}'=green \
                  kibana/$(ES_CLUSTER_NAME) --timeout=300s
            timeoutInMinutes: 7

  # Stage 3: Configure snapshots, index settings, sync credentials
  - stage: ECK_Configure
    displayName: 'Configure Snapshots & Settings'
    dependsOn: ECK_Stack
    jobs:
      - job: ConfigureECK
        displayName: 'ECK Configuration'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install GKE Auth Plugin & Authenticate'
            inputs:
              targetType: inline
              script: |
                sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-sdk-gke-gcloud-auth-plugin
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "##vso[task.setvariable variable=USE_GKE_GCLOUD_AUTH_PLUGIN]True"

                echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json
                gcloud auth activate-service-account --key-file=$(Agent.TempDirectory)/gcp-key.json
                gcloud container clusters get-credentials ${{ parameters.clusterName }} \
                  --region $(CLUSTER_LOCATION) \
                  --project $(GCP_PROJECT_ID)

          # Setup snapshot repository and SLM policy
          - task: Bash@3
            displayName: 'Setup Snapshot Repository & SLM Policy'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                export GCS_BUCKET_NAME="$(GCS_BUCKET_NAME)"
                export SNAPSHOT_REPO_NAME="$(SNAPSHOT_REPO_NAME)"
                export SNAPSHOT_BASE_PATH="$(SNAPSHOT_BASE_PATH)"
                export SLM_POLICY_NAME="$(SLM_POLICY_NAME)"
                envsubst < $(System.DefaultWorkingDirectory)/eck/06-snapshot-repository.yaml | kubectl apply -f -

          # Setup default index settings
          - task: Bash@3
            displayName: 'Setup Index Settings'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                envsubst < $(System.DefaultWorkingDirectory)/eck/07-index-settings.yaml | kubectl apply -f -

          # Wait for setup jobs
          - task: Bash@3
            displayName: 'Wait for Setup Jobs'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl -n elastic-stack wait --for=condition=complete job/setup-snapshot-repo --timeout=300s || true
                kubectl -n elastic-stack wait --for=condition=complete job/setup-index-settings --timeout=300s || true

          # Sync Kibana credentials to GCP Secret Manager
          - task: Bash@3
            displayName: 'Sync Kibana Credentials to Secret Manager'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                ES_PASSWORD=$(kubectl get secret $(ES_CLUSTER_NAME)-es-elastic-user -n elastic-stack -o jsonpath='{.data.elastic}' | base64 -d)
                KIBANA_LB=$(kubectl get svc $(ES_CLUSTER_NAME)-kb-http -n elastic-stack -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                ES_LB=$(kubectl get svc $(ES_CLUSTER_NAME)-es-http -n elastic-stack -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

                SECRET_VALUE="{\"username\":\"elastic\",\"password\":\"${ES_PASSWORD}\",\"kibana_url\":\"https://${KIBANA_LB}:5601\",\"elasticsearch_url\":\"https://${ES_LB}:9200\"}"

                echo -n "$SECRET_VALUE" | gcloud secrets versions add kibana-credentials \
                  --data-file=- --project=$(GCP_PROJECT_ID) 2>/dev/null || \
                echo -n "$SECRET_VALUE" | gcloud secrets versions add elastic-credentials \
                  --data-file=- --project=$(GCP_PROJECT_ID) 2>/dev/null || true

                echo "Credentials synced to GCP Secret Manager."
                echo "Kibana URL: https://${KIBANA_LB}:5601"
                echo "Elasticsearch URL: https://${ES_LB}:9200"
                echo "Username: elastic"
