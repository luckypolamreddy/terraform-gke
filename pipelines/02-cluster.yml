# Pipeline: GKE Cluster + Subnet
# Subnet is tied to cluster lifecycle - both created/destroyed together

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: apply
    values:
      - apply
      - destroy

  - name: project
    displayName: 'GCP Project'
    type: string
    default: project-a
    values:
      - project-a
      - project-b

  - name: clusterName
    displayName: 'Cluster Name'
    type: string

variables:
  - group: gcp-credentials-${{ parameters.project }}

stages:
  - stage: Cluster
    displayName: 'Cluster - ${{ parameters.action }}'
    jobs:
      - deployment: TerraformCluster
        displayName: 'Terraform Cluster'
        environment: '${{ parameters.project }}-cluster'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-steps.yml
                  parameters:
                    action: ${{ parameters.action }}
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/cluster'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/cluster.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'cluster/${{ parameters.project }}/${{ parameters.clusterName }}'
                    extraVars: '-var=cluster_name=${{ parameters.clusterName }}'
