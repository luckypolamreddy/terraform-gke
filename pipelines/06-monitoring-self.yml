# Pipeline: ECK Self-Monitoring (Option A)
# Elasticsearch monitors itself - metrics and logs sent to the same cluster

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: deploy
    values:
      - deploy
      - destroy

  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

  - name: clusterName
    displayName: 'GKE Cluster Name'
    type: string

variables:
  - group: gcp-credentials-${{ parameters.project }}
  - name: ES_CLUSTER_NAME
    value: elastic-prod
  - name: ES_VERSION
    value: '9.1.3'
  - name: CLUSTER_LOCATION
    value: us-east1

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: SelfMonitoring
    displayName: 'Self-Monitoring - ${{ parameters.action }}'
    jobs:
      - job: MonitoringSelf
        displayName: 'Self-Monitoring ${{ parameters.action }}'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install GKE Auth Plugin & Authenticate'
            inputs:
              targetType: inline
              script: |
                sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-sdk-gke-gcloud-auth-plugin
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "##vso[task.setvariable variable=USE_GKE_GCLOUD_AUTH_PLUGIN]True"

                echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json
                gcloud auth activate-service-account --key-file=$(Agent.TempDirectory)/gcp-key.json
                gcloud container clusters get-credentials ${{ parameters.clusterName }} \
                  --region $(CLUSTER_LOCATION) \
                  --project $(GCP_PROJECT_ID)

          # --- DEPLOY ---
          - ${{ if eq(parameters.action, 'deploy') }}:
            - task: Bash@3
              displayName: 'Get Monitoring Credentials'
              name: getCreds
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  PASS=$(kubectl get secret $(ES_CLUSTER_NAME)-es-elastic-user -n elastic-stack -o jsonpath='{.data.elastic}' | base64 -d)
                  echo "##vso[task.setvariable variable=MONITORING_PASSWORD;issecret=true;isOutput=true]$PASS"

            - task: Bash@3
              displayName: 'Deploy Stack Monitoring Config'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                  envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-a-self/stack-monitoring.yaml | kubectl apply -f -

            - task: Bash@3
              displayName: 'Deploy Metricbeat'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                  export ES_VERSION="$(ES_VERSION)"
                  export MONITORING_USER="elastic"
                  export MONITORING_PASSWORD="$(getCreds.MONITORING_PASSWORD)"
                  envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-a-self/metricbeat.yaml | kubectl apply -f -

            - task: Bash@3
              displayName: 'Deploy Filebeat'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                  export ES_VERSION="$(ES_VERSION)"
                  export MONITORING_USER="elastic"
                  export MONITORING_PASSWORD="$(getCreds.MONITORING_PASSWORD)"
                  envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-a-self/filebeat.yaml | kubectl apply -f -

            - task: Bash@3
              displayName: 'Verify Monitoring'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  echo "Waiting for beats to be ready..."
                  kubectl -n elastic-stack wait --for=jsonpath='{.status.health}'=green beat/metricbeat-monitoring --timeout=120s 2>/dev/null || echo "Metricbeat still starting..."
                  kubectl -n elastic-stack wait --for=jsonpath='{.status.health}'=green beat/filebeat-monitoring --timeout=120s 2>/dev/null || echo "Filebeat still starting..."
                  echo "Self-monitoring deployed. Check Kibana Stack Monitoring."

          # --- DESTROY ---
          - ${{ if eq(parameters.action, 'destroy') }}:
            - task: Bash@3
              displayName: 'Delete Filebeat'
              continueOnError: true
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl delete beat filebeat-monitoring -n elastic-stack || true

            - task: Bash@3
              displayName: 'Delete Metricbeat'
              continueOnError: true
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl delete beat metricbeat-monitoring -n elastic-stack || true

            - task: Bash@3
              displayName: 'Delete RBAC Resources'
              continueOnError: true
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl delete clusterrolebinding metricbeat filebeat clusterrole metricbeat filebeat sa metricbeat filebeat -n elastic-stack || true
