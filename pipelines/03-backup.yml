# Pipeline: GKE Backup Plan
# Handles backup plan create/destroy with automatic cleanup

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: apply
    values:
      - apply
      - destroy

  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

  - name: clusterName
    displayName: 'Cluster Name'
    type: string

variables:
  - group: gcp-credentials-${{ parameters.project }}

stages:
  - stage: Backup
    displayName: 'Backup Plan - ${{ parameters.action }}'
    jobs:
      - deployment: TerraformBackup
        displayName: 'Terraform Backup'
        environment: '${{ parameters.project }}-backup'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-steps.yml
                  parameters:
                    action: ${{ parameters.action }}
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/backup'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/backup-cluster.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'backup/${{ parameters.project }}/${{ parameters.clusterName }}'
                    extraVars: '-var=cluster_name=${{ parameters.clusterName }}'
