# Pipeline: GKE Cluster + Subnet
# Subnet is tied to cluster lifecycle - both created/destroyed together

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: apply
    values:
      - apply
      - destroy

  - name: project
    displayName: 'GCP Project'
    type: string
    default: project-a
    values:
      - project-a
      - project-b

  - name: clusterConfig
    displayName: 'Cluster config file'
    type: string
    default: cluster-1
    values:
      - cluster-1

  - name: clusterName
    displayName: 'Cluster Name (leave empty to use tfvars default)'
    type: string
    default: ''

  - name: kubernetesVersion
    displayName: 'Kubernetes Version (e.g., 1.30, 1.31)'
    type: string
    default: ''

  - name: machineType
    displayName: 'Machine Type override for controlplane-pool (leave empty for default)'
    type: string
    default: ''

variables:
  - group: gcp-credentials-${{ parameters.project }}

stages:
  - stage: Cluster
    displayName: 'Cluster - ${{ parameters.action }}'
    jobs:
      - deployment: TerraformCluster
        displayName: 'Terraform Cluster'
        environment: '${{ parameters.project }}-cluster'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Bash@3
                  name: buildVars
                  displayName: 'Build variable overrides'
                  inputs:
                    targetType: inline
                    script: |
                      EXTRA=""
                      if [ -n "${{ parameters.clusterName }}" ]; then
                        EXTRA="$EXTRA -var=cluster_name=${{ parameters.clusterName }}"
                      fi
                      if [ -n "${{ parameters.kubernetesVersion }}" ]; then
                        EXTRA="$EXTRA -var=kubernetes_version=${{ parameters.kubernetesVersion }}"
                      fi
                      echo "##vso[task.setvariable variable=EXTRA_VARS;isOutput=true]$EXTRA"

                - template: templates/terraform-steps.yml
                  parameters:
                    action: ${{ parameters.action }}
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/cluster'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/${{ parameters.clusterConfig }}.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'cluster/${{ parameters.project }}/${{ parameters.clusterConfig }}'
                    extraVars: '$(buildVars.EXTRA_VARS)'
