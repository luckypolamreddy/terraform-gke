# Pipeline: ECK Dedicated Monitoring (Option B)
# Separate monitoring Elasticsearch cluster collects metrics from production cluster

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: deploy
    values:
      - deploy
      - destroy

  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

  - name: clusterName
    displayName: 'GKE Cluster Name'
    type: string

variables:
  - group: gcp-credentials-${{ parameters.project }}
  - name: ES_CLUSTER_NAME
    value: elastic-prod
  - name: MONITORING_CLUSTER_NAME
    value: elastic-monitoring
  - name: MONITORING_NODE_COUNT
    value: '2'
  - name: ES_VERSION
    value: '9.1.3'
  - name: CLUSTER_LOCATION
    value: us-east1

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: DedicatedMonitoring
    displayName: 'Dedicated Monitoring - ${{ parameters.action }}'
    jobs:
      - job: MonitoringDedicated
        displayName: 'Dedicated Monitoring ${{ parameters.action }}'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install GKE Auth Plugin & Authenticate'
            inputs:
              targetType: inline
              script: |
                sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-sdk-gke-gcloud-auth-plugin
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "##vso[task.setvariable variable=USE_GKE_GCLOUD_AUTH_PLUGIN]True"

                echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json
                gcloud auth activate-service-account --key-file=$(Agent.TempDirectory)/gcp-key.json
                gcloud container clusters get-credentials ${{ parameters.clusterName }} \
                  --region $(CLUSTER_LOCATION) \
                  --project $(GCP_PROJECT_ID)

          # --- DEPLOY ---
          - ${{ if eq(parameters.action, 'deploy') }}:
            - task: Bash@3
              displayName: 'Deploy Monitoring Elasticsearch'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  export MONITORING_CLUSTER_NAME="$(MONITORING_CLUSTER_NAME)"
                  export MONITORING_NODE_COUNT="$(MONITORING_NODE_COUNT)"
                  export ES_VERSION="$(ES_VERSION)"
                  envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-b-dedicated/monitoring-elasticsearch.yaml | kubectl apply -f -

            - task: Bash@3
              displayName: 'Wait for Monitoring ES Ready'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  echo "Waiting for monitoring Elasticsearch..."
                  kubectl -n elastic-stack wait --for=jsonpath='{.status.health}'=green \
                    elasticsearch/$(MONITORING_CLUSTER_NAME) --timeout=600s
              timeoutInMinutes: 12

            - task: Bash@3
              displayName: 'Configure Stack Monitoring'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                  export MONITORING_CLUSTER_NAME="$(MONITORING_CLUSTER_NAME)"
                  envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-b-dedicated/stack-monitoring.yaml | kubectl apply -f -

            - task: Bash@3
              displayName: 'Get Credentials'
              name: getCreds
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  PASS=$(kubectl get secret $(ES_CLUSTER_NAME)-es-elastic-user -n elastic-stack -o jsonpath='{.data.elastic}' | base64 -d)
                  echo "##vso[task.setvariable variable=MONITORING_PASSWORD;issecret=true;isOutput=true]$PASS"

            - task: Bash@3
              displayName: 'Deploy Metricbeat'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                  export MONITORING_CLUSTER_NAME="$(MONITORING_CLUSTER_NAME)"
                  export ES_VERSION="$(ES_VERSION)"
                  export MONITORING_USER="elastic"
                  export MONITORING_PASSWORD="$(getCreds.MONITORING_PASSWORD)"
                  envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-b-dedicated/metricbeat.yaml | kubectl apply -f -

            - task: Bash@3
              displayName: 'Deploy Filebeat'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  export ES_CLUSTER_NAME="$(ES_CLUSTER_NAME)"
                  export MONITORING_CLUSTER_NAME="$(MONITORING_CLUSTER_NAME)"
                  export ES_VERSION="$(ES_VERSION)"
                  export MONITORING_USER="elastic"
                  export MONITORING_PASSWORD="$(getCreds.MONITORING_PASSWORD)"
                  envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-b-dedicated/filebeat.yaml | kubectl apply -f -

            - task: Bash@3
              displayName: 'Verify Monitoring'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  echo "Monitoring cluster status:"
                  kubectl -n elastic-stack get elasticsearch $(MONITORING_CLUSTER_NAME)
                  echo ""
                  echo "Beats status:"
                  kubectl -n elastic-stack get beat
                  echo ""
                  MONITORING_KB_IP=$(kubectl get svc $(MONITORING_CLUSTER_NAME)-kb-http -n elastic-stack -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
                  echo "Monitoring Kibana URL: https://${MONITORING_KB_IP}:5601"

          # --- DESTROY ---
          - ${{ if eq(parameters.action, 'destroy') }}:
            - task: Bash@3
              displayName: 'Delete Filebeat'
              continueOnError: true
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl delete beat filebeat-dedicated -n elastic-stack || true

            - task: Bash@3
              displayName: 'Delete Metricbeat'
              continueOnError: true
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl delete beat metricbeat-dedicated -n elastic-stack || true

            - task: Bash@3
              displayName: 'Remove Monitoring Config from Production'
              continueOnError: true
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl -n elastic-stack patch elasticsearch $(ES_CLUSTER_NAME) --type=merge -p '{"spec":{"monitoring":null}}'
                  kubectl -n elastic-stack patch kibana $(ES_CLUSTER_NAME) --type=merge -p '{"spec":{"monitoring":null}}'

            - task: Bash@3
              displayName: 'Delete Monitoring Kibana'
              continueOnError: true
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl delete kibana $(MONITORING_CLUSTER_NAME) -n elastic-stack || true

            - task: Bash@3
              displayName: 'Delete Monitoring Elasticsearch'
              continueOnError: true
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl delete elasticsearch $(MONITORING_CLUSTER_NAME) -n elastic-stack || true

            - task: Bash@3
              displayName: 'Wait for Cleanup'
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl -n elastic-stack wait --for=delete elasticsearch/$(MONITORING_CLUSTER_NAME) --timeout=300s 2>/dev/null || true

            - task: Bash@3
              displayName: 'Delete RBAC Resources'
              continueOnError: true
              inputs:
                targetType: inline
                script: |
                  export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                  kubectl delete clusterrolebinding metricbeat-dedicated filebeat-dedicated clusterrole metricbeat-dedicated filebeat-dedicated sa metricbeat-dedicated filebeat-dedicated -n elastic-stack || true
