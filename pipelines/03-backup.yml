# Pipeline: GKE Backup Plan
# Manages backup plan lifecycle with safe teardown workflow.
#
# Actions:
#   apply   - creates/updates backup plan (schedule active)
#   pause   - pauses the backup schedule (keeps plan + existing backups for 7 days)
#   destroy - deletes all backups + backup plan (use after backups expire or when forced)
#
# Safe teardown workflow:
#   1. Run with action=pause   → schedule stops, existing backups retained (7-day TTL)
#   2. Wait 7 days             → retention policy auto-expires old backups
#   3. Run with action=destroy → cleans up empty plan (or force-deletes remaining backups)

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: apply
    values:
      - apply
      - pause
      - destroy

  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

  - name: clusterName
    displayName: 'Cluster Name'
    type: string

variables:
  - group: gcp-credentials-${{ parameters.project }}

pool:
  vmImage: 'ubuntu-latest'

stages:
  # Stage 1: Plan (always runs)
  - stage: Plan
    displayName: 'Terraform Plan'
    jobs:
      - deployment: TerraformPlan
        displayName: 'Terraform Plan'
        environment: '${{ parameters.project }}-backup'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-plan-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/backup'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/backup-cluster.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'backup/${{ parameters.project }}/${{ parameters.clusterName }}'
                    extraVars: '-var=cluster_name=${{ parameters.clusterName }}'

  # Stage 2: Apply (action=apply — schedule active)
  - stage: Apply
    displayName: 'Terraform Apply (schedule active)'
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
    jobs:
      - deployment: TerraformApply
        displayName: 'Terraform Apply'
        environment: '${{ parameters.project }}-backup'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-apply-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/backup'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/backup-cluster.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'backup/${{ parameters.project }}/${{ parameters.clusterName }}'
                    extraVars: '-var=cluster_name=${{ parameters.clusterName }}'

  # Stage 3: Pause (action=pause — stops schedule, keeps backups for 7-day retention)
  - stage: Pause
    displayName: 'Pause Backup Schedule'
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'pause'))
    jobs:
      - deployment: TerraformPause
        displayName: 'Terraform Apply (paused=true)'
        environment: '${{ parameters.project }}-backup'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-apply-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/backup'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/backup-cluster.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'backup/${{ parameters.project }}/${{ parameters.clusterName }}'
                    extraVars: '-var=cluster_name=${{ parameters.clusterName }} -var=paused=true'

  # Stage 4: Destroy (action=destroy — cleanup backups then delete plan)
  - stage: Destroy
    displayName: 'Terraform Destroy'
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
    jobs:
      - deployment: TerraformDestroy
        displayName: 'Terraform Destroy'
        environment: '${{ parameters.project }}-backup'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Bash@3
                  displayName: 'Write GCP credentials'
                  inputs:
                    targetType: inline
                    script: echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json

                - task: Bash@3
                  displayName: 'Cleanup backups before destroy'
                  inputs:
                    targetType: inline
                    script: |
                      set -e
                      export CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$(Agent.TempDirectory)/gcp-key.json"
                      gcloud auth activate-service-account --key-file="$(Agent.TempDirectory)/gcp-key.json"

                      PLAN_NAME="${{ parameters.clusterName }}-backup-01"
                      PROJECT="${{ parameters.project }}"
                      LOCATION="us-east1"

                      echo "=== Pausing backup plan: $PLAN_NAME ==="
                      gcloud beta container backup-restore backup-plans update "$PLAN_NAME" \
                        --project="$PROJECT" \
                        --location="$LOCATION" \
                        --paused 2>/dev/null || echo "Plan may already be paused or not exist"

                      echo ""
                      echo "=== Listing existing backups ==="
                      BACKUPS=$(gcloud beta container backup-restore backups list \
                        --backup-plan="$PLAN_NAME" \
                        --location="$LOCATION" \
                        --project="$PROJECT" \
                        --format="value(name)" 2>/dev/null || true)

                      if [ -z "$BACKUPS" ]; then
                        echo "No backups found — safe to destroy plan."
                      else
                        echo "Found backups to delete:"
                        echo "$BACKUPS"
                        echo ""

                        for BACKUP in $BACKUPS; do
                          BACKUP_NAME=$(basename "$BACKUP")
                          echo "Deleting backup: $BACKUP_NAME ..."
                          gcloud beta container backup-restore backups delete "$BACKUP_NAME" \
                            --backup-plan="$PLAN_NAME" \
                            --location="$LOCATION" \
                            --project="$PROJECT" \
                            --quiet --async 2>/dev/null || echo "  Failed to delete $BACKUP_NAME (may already be deleting)"
                        done

                        echo ""
                        echo "=== Waiting for backup deletions to complete ==="
                        MAX_WAIT=300
                        ELAPSED=0
                        while [ $ELAPSED -lt $MAX_WAIT ]; do
                          REMAINING=$(gcloud beta container backup-restore backups list \
                            --backup-plan="$PLAN_NAME" \
                            --location="$LOCATION" \
                            --project="$PROJECT" \
                            --format="value(name)" 2>/dev/null | wc -l || echo "0")

                          if [ "$REMAINING" -eq 0 ]; then
                            echo "All backups deleted."
                            break
                          fi

                          echo "  $REMAINING backup(s) still deleting... (${ELAPSED}s / ${MAX_WAIT}s)"
                          sleep 15
                          ELAPSED=$((ELAPSED + 15))
                        done

                        if [ $ELAPSED -ge $MAX_WAIT ]; then
                          echo "WARNING: Timed out waiting for backup deletion. Proceeding with destroy anyway."
                        fi
                      fi
                    env:
                      USE_GKE_GCLOUD_AUTH_PLUGIN: 'True'
                  timeoutInMinutes: 10

                - template: templates/terraform-destroy-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/backup'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/backup-cluster.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'backup/${{ parameters.project }}/${{ parameters.clusterName }}'
                    extraVars: '-var=cluster_name=${{ parameters.clusterName }}'
