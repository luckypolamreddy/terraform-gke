# Pipeline: GKE Cluster + Subnet
# Subnet is tied to cluster lifecycle - both created/destroyed together
#
# Stages:
#   1. Plan (always runs) - dry run showing what would change
#   2. Apply (only when action=apply) - creates/updates infrastructure
#   3. Destroy (only when action=destroy) - tears down infrastructure

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: apply
    values:
      - apply
      - destroy

  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

  - name: clusterName
    displayName: 'Cluster Name'
    type: string

  - name: clusterIndex
    displayName: 'Cluster Index (for auto CIDR - prod only, 1-250)'
    type: number
    default: 1

  - name: nodePoolType
    displayName: 'Node Pool Type'
    type: string
    default: 'standard'
    values:
      - standard
      - gpu
      - both

  - name: gpuPoolMachineType
    displayName: 'GPU Node Machine Type (ignored if nodePoolType=standard)'
    type: string
    default: 'n1-highmem-16'
    values:
      - n1-highmem-16
      - n1-highmem-8
      - n1-standard-16
      - n1-standard-8
      - a2-highgpu-1g

  - name: gpuType
    displayName: 'GPU Accelerator Type (ignored if nodePoolType=standard)'
    type: string
    default: 'nvidia-tesla-t4'
    values:
      - nvidia-tesla-t4
      - nvidia-tesla-v100
      - nvidia-tesla-a100
      - nvidia-l4

  - name: gpuCount
    displayName: 'GPUs per Node (ignored if nodePoolType=standard)'
    type: number
    default: 1

  - name: gpuPoolNodeCount
    displayName: 'GPU Node Count (ignored if nodePoolType=standard)'
    type: number
    default: 1

  - name: gpuPoolZone
    displayName: 'GPU Pool Zone (e.g. us-east1-b, ignored if nodePoolType=standard)'
    type: string
    default: 'us-east1-b'

variables:
  - group: gcp-credentials-${{ parameters.project }}

pool:
  vmImage: 'ubuntu-latest'

stages:
  # Stage 0: Validate inputs before any infrastructure changes
  - stage: Validate
    displayName: 'Validate Inputs'
    jobs:
      - job: ValidateClusterName
        displayName: 'Validate Cluster Name'
        steps:
          - template: templates/validate-cluster-name.yml
            parameters:
              clusterName: ${{ parameters.clusterName }}

  # Stage 1: Plan (always runs - dry run)
  - stage: Plan
    displayName: 'Terraform Plan (dry run)'
    dependsOn: Validate
    jobs:
      - deployment: TerraformPlan
        displayName: 'Terraform Plan'
        environment: '${{ parameters.project }}-cluster'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-plan-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/cluster'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/cluster.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'cluster/${{ parameters.project }}/${{ parameters.clusterName }}'
                    extraVars: '-var=cluster_name=${{ parameters.clusterName }} -var=cluster_index=${{ parameters.clusterIndex }} -var=node_pool_type=${{ parameters.nodePoolType }} -var=gpu_pool_machine_type=${{ parameters.gpuPoolMachineType }} -var=gpu_type=${{ parameters.gpuType }} -var=gpu_count=${{ parameters.gpuCount }} -var=gpu_pool_node_count=${{ parameters.gpuPoolNodeCount }} -var=gpu_pool_zone=${{ parameters.gpuPoolZone }}'

  # Stage 2: Apply (only when action=apply)
  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
    jobs:
      - deployment: TerraformApply
        displayName: 'Terraform Apply'
        environment: '${{ parameters.project }}-cluster'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-apply-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/cluster'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/cluster.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'cluster/${{ parameters.project }}/${{ parameters.clusterName }}'
                    extraVars: '-var=cluster_name=${{ parameters.clusterName }} -var=cluster_index=${{ parameters.clusterIndex }} -var=node_pool_type=${{ parameters.nodePoolType }} -var=gpu_pool_machine_type=${{ parameters.gpuPoolMachineType }} -var=gpu_type=${{ parameters.gpuType }} -var=gpu_count=${{ parameters.gpuCount }} -var=gpu_pool_node_count=${{ parameters.gpuPoolNodeCount }} -var=gpu_pool_zone=${{ parameters.gpuPoolZone }}'

  # Stage 3: Destroy (only when action=destroy)
  - stage: Destroy
    displayName: 'Terraform Destroy'
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
    jobs:
      - deployment: TerraformDestroy
        displayName: 'Terraform Destroy'
        environment: '${{ parameters.project }}-cluster'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-destroy-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/cluster'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/cluster.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'cluster/${{ parameters.project }}/${{ parameters.clusterName }}'
                    extraVars: '-var=cluster_name=${{ parameters.clusterName }} -var=cluster_index=${{ parameters.clusterIndex }} -var=node_pool_type=${{ parameters.nodePoolType }} -var=gpu_pool_machine_type=${{ parameters.gpuPoolMachineType }} -var=gpu_type=${{ parameters.gpuType }} -var=gpu_count=${{ parameters.gpuCount }} -var=gpu_pool_node_count=${{ parameters.gpuPoolNodeCount }} -var=gpu_pool_zone=${{ parameters.gpuPoolZone }}'
