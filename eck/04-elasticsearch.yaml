apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: ${ES_CLUSTER_NAME}
  namespace: elastic-stack
spec:
  version: ${ES_VERSION}

  # GCS repository plugin for snapshots
  secureSettings:
    - secretName: gcs-credentials

  nodeSets:
    - name: master
      count: 3
      config:
        node.roles: ["master", "data", "data_content", "data_hot", "ingest", "transform"]
        node.store.allow_mmap: false
        # Synonyms filter path
        path.repo: ["/usr/share/elasticsearch/config/synonyms"]
      podTemplate:
        spec:
          initContainers:
            - name: sysctl
              securityContext:
                privileged: true
                runAsUser: 0
              command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 48Gi
                  cpu: "8"
                limits:
                  memory: 48Gi
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms${ES_JVM_HEAP} -Xmx${ES_JVM_HEAP}"
              volumeMounts:
                - name: synonyms
                  mountPath: /usr/share/elasticsearch/config/synonyms
                  readOnly: true
          volumes:
            - name: synonyms
              configMap:
                name: elasticsearch-synonyms
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: premium-rwo
            resources:
              requests:
                storage: 500Gi

  # External LoadBalancer for Elasticsearch
  http:
    service:
      spec:
        type: LoadBalancer
    tls:
      selfSignedCertificate:
        disabled: false
