# Template: Terraform Plan (dry run)
# Shows what would change without making any modifications
parameters:
  - name: workingDirectory
    type: string
  - name: tfvarsFile
    type: string
  - name: backendBucket
    type: string
  - name: backendPrefix
    type: string
  - name: credentialsFile
    type: string
    default: '$(Agent.TempDirectory)/gcp-key.json'
  - name: extraVars
    type: string
    default: ''

steps:
  - task: Bash@3
    displayName: 'Write GCP credentials file'
    inputs:
      targetType: inline
      script: echo '$(GCP_SA_KEY)' > ${{ parameters.credentialsFile }}

  - task: TerraformInstaller@1
    displayName: 'Install Terraform 1.14.6'
    inputs:
      terraformVersion: "1.14.6"

  - task: Bash@3
    displayName: 'Debug: Show checked-out code'
    inputs:
      targetType: inline
      workingDirectory: ${{ parameters.workingDirectory }}
      script: |
        echo "=== Git commit ==="
        git log --oneline -1
        echo "=== Terraform files in working directory ==="
        ls -la *.tf
        echo "=== locals block ==="
        grep -A3 'locals' main.tf || echo "No locals block found"

  - task: Bash@3
    displayName: 'Terraform Init'
    inputs:
      targetType: inline
      workingDirectory: ${{ parameters.workingDirectory }}
      script: |
        export GOOGLE_APPLICATION_CREDENTIALS="${{ parameters.credentialsFile }}"
        terraform init -input=false \
          -backend-config="bucket=${{ parameters.backendBucket }}" \
          -backend-config="prefix=${{ parameters.backendPrefix }}" \
          -backend-config="credentials=${{ parameters.credentialsFile }}"

  - task: Bash@3
    displayName: 'Terraform Plan (dry run)'
    inputs:
      targetType: inline
      workingDirectory: ${{ parameters.workingDirectory }}
      script: |
        export GOOGLE_APPLICATION_CREDENTIALS="${{ parameters.credentialsFile }}"
        terraform plan -input=false \
          -var-file="${{ parameters.tfvarsFile }}" \
          -var="credentials_file=${{ parameters.credentialsFile }}" \
          ${{ parameters.extraVars }}
