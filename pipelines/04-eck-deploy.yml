# Pipeline: ECK Deploy
# Deploys ECK operator, Elasticsearch, Kibana, snapshots via single reusable template.
# All resource specs are configurable via pipeline variables.

trigger: none

parameters:
  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

  - name: clusterName
    displayName: 'GKE Cluster Name'
    type: string

  - name: jvmMemory
    displayName: 'ES JVM Heap (e.g. 8g)'
    type: string
    default: '8g'

variables:
  - group: gcp-credentials-${{ parameters.project }}
  # Variable group must contain: GCP_SA_KEY, GCP_PROJECT_ID

  # ECK / Elastic versions
  - name: ECK_OPERATOR_VERSION
    value: '9.3.1'
  - name: elasticsearchOperatorVersion
    value: '9.3.1'
  - name: CLUSTER_LOCATION
    value: us-east1

  # Elasticsearch settings
  - name: elasticsearchName
    value: elasticsearch
  - name: eckNamespace
    value: elastic-stack
  - name: elasticsearchNoOfNodes
    value: '3'
  - name: elasticsearchStorage
    value: '500Ti'
  - name: elasticsearchMemory
    value: '16Gi'
  - name: elasticsearchMemoryLimit
    value: '32Gi'
  - name: elasticsearchCpu
    value: '8'
  - name: elasticsearchCpuLimit
    value: '12'

  # Kibana settings
  - name: kibanaName
    value: kibana
  - name: kibanaNoOfNodes
    value: '2'
  - name: kibanaMemory
    value: '4Gi'
  - name: kibanaMemoryLimit
    value: '8Gi'
  - name: kibanaCpu
    value: '2'
  - name: kibanaCpuLimit
    value: '4'

  # GCS bucket for snapshots (auto-derived from cluster name)
  - name: GCS_BUCKET_NAME
    value: ${{ parameters.clusterName }}-bucket-01

  # Working directory for ECK manifests
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/eck'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: ECK_Deploy
    displayName: 'Deploy ECK Stack'
    jobs:
      - job: DeployECK
        displayName: 'ECK Deployment'
        timeoutInMinutes: 45
        steps:
          - checkout: self

          - template: templates/eck-deployment-steps.yaml
            parameters:
              clusterName: ${{ parameters.clusterName }}
              jvmMemory: ${{ parameters.jvmMemory }}
