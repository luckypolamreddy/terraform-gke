apiVersion: v1
kind: ServiceAccount
metadata:
  name: eck-operations
  namespace: elastic-stack
  labels:
    app.kubernetes.io/part-of: elastic-stack
  # Uncomment for Workload Identity:
  # annotations:
  #   iam.gke.io/gcp-service-account: "eck-ops@YOUR_PROJECT.iam.gserviceaccount.com"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eck-operations-role
  namespace: elastic-stack
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "elasticsearch-es-elastic-user"
      - "elasticsearch-es-http-certs-public"
      - "gcs-credentials"
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eck-operations-binding
  namespace: elastic-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eck-operations-role
subjects:
  - kind: ServiceAccount
    name: eck-operations
    namespace: elastic-stack
