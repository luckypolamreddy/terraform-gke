# Pipeline: Foundation (VPC only)
# Creates the VPC that persists across cluster lifecycles.
# GCS bucket is now managed by the cluster pipeline (02-cluster.yml).
#
# Actions:
#   apply   - creates/updates the VPC
#   destroy - tears down the VPC (only if no clusters depend on it)

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: apply
    values:
      - apply
      - destroy

  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

variables:
  - group: gcp-credentials-${{ parameters.project }}
  # Variable group should contain: GCP_SA_KEY, TF_STATE_BUCKET

pool:
  vmImage: 'ubuntu-latest'

stages:
  # Stage 1: Plan (always runs - dry run)
  - stage: Plan
    displayName: 'Terraform Plan (dry run)'
    jobs:
      - deployment: TerraformPlan
        displayName: 'Terraform Plan'
        environment: '${{ parameters.project }}-foundation'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-plan-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/foundation'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/foundation.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'foundation/${{ parameters.project }}'

  # Stage 2: Apply (only when action=apply)
  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
    jobs:
      - deployment: TerraformApply
        displayName: 'Terraform Apply'
        environment: '${{ parameters.project }}-foundation'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-apply-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/foundation'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/foundation.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'foundation/${{ parameters.project }}'

  # Stage 3: Destroy (only when action=destroy)
  - stage: Destroy
    displayName: 'Terraform Destroy'
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
    jobs:
      - deployment: TerraformDestroy
        displayName: 'Terraform Destroy'
        environment: '${{ parameters.project }}-foundation'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/terraform-destroy-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/foundation'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/foundation.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'foundation/${{ parameters.project }}'
