# Pipeline: ECK Destroy
# Removes ECK stack and operator in correct order

trigger: none

parameters:
  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

  - name: clusterName
    displayName: 'GKE Cluster Name'
    type: string

  - name: removeOperator
    displayName: 'Also remove ECK operator?'
    type: boolean
    default: true

variables:
  - group: gcp-credentials-${{ parameters.project }}
  - name: ES_CLUSTER_NAME
    value: elastic-prod
  - name: ECK_OPERATOR_VERSION
    value: '9.1.3'
  - name: CLUSTER_LOCATION
    value: us-east1

pool:
  vmImage: 'ubuntu-latest'

stages:
  # Stage 1: Remove monitoring (if exists)
  - stage: RemoveMonitoring
    displayName: 'Remove Monitoring'
    jobs:
      - job: CleanMonitoring
        displayName: 'Remove Monitoring Resources'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install GKE Auth Plugin & Authenticate'
            inputs:
              targetType: inline
              script: |
                sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-sdk-gke-gcloud-auth-plugin
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "##vso[task.setvariable variable=USE_GKE_GCLOUD_AUTH_PLUGIN]True"

                echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json
                gcloud auth activate-service-account --key-file=$(Agent.TempDirectory)/gcp-key.json
                gcloud container clusters get-credentials ${{ parameters.clusterName }} \
                  --region $(CLUSTER_LOCATION) \
                  --project $(GCP_PROJECT_ID)

          - task: Bash@3
            displayName: 'Delete Metricbeat'
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete beat --all -n elastic-stack || true

          - task: Bash@3
            displayName: 'Delete Monitoring Cluster'
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete kibana,elasticsearch -l app.kubernetes.io/part-of=monitoring -n elastic-stack || true

  # Stage 2: Remove Elastic Stack
  - stage: RemoveStack
    displayName: 'Remove Elastic Stack'
    dependsOn: RemoveMonitoring
    jobs:
      - job: CleanStack
        displayName: 'Remove ES & Kibana'
        steps:
          - task: Bash@3
            displayName: 'Install GKE Auth Plugin & Authenticate'
            inputs:
              targetType: inline
              script: |
                sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-sdk-gke-gcloud-auth-plugin
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "##vso[task.setvariable variable=USE_GKE_GCLOUD_AUTH_PLUGIN]True"

                echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json
                gcloud auth activate-service-account --key-file=$(Agent.TempDirectory)/gcp-key.json
                gcloud container clusters get-credentials ${{ parameters.clusterName }} \
                  --region $(CLUSTER_LOCATION) \
                  --project $(GCP_PROJECT_ID)

          - task: Bash@3
            displayName: 'Delete Setup Jobs'
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete job setup-snapshot-repo setup-index-settings -n elastic-stack || true

          - task: Bash@3
            displayName: 'Delete Kibana'
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete kibana $(ES_CLUSTER_NAME) -n elastic-stack || true

          - task: Bash@3
            displayName: 'Wait for Kibana deletion'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl -n elastic-stack wait --for=delete kibana/$(ES_CLUSTER_NAME) --timeout=120s 2>/dev/null || true

          - task: Bash@3
            displayName: 'Delete Elasticsearch'
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete elasticsearch $(ES_CLUSTER_NAME) -n elastic-stack || true

          - task: Bash@3
            displayName: 'Wait for ES deletion'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl -n elastic-stack wait --for=delete elasticsearch/$(ES_CLUSTER_NAME) --timeout=300s 2>/dev/null || true

          - task: Bash@3
            displayName: 'Delete Secrets & ConfigMaps'
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete secret gcs-credentials configmap elasticsearch-synonyms -n elastic-stack || true

  # Stage 3: Remove Operator (optional)
  - stage: RemoveOperator
    displayName: 'Remove ECK Operator'
    dependsOn: RemoveStack
    condition: eq('${{ parameters.removeOperator }}', true)
    jobs:
      - job: CleanOperator
        displayName: 'Remove ECK Operator'
        steps:
          - task: Bash@3
            displayName: 'Install GKE Auth Plugin & Authenticate'
            inputs:
              targetType: inline
              script: |
                sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-sdk-gke-gcloud-auth-plugin
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                echo "##vso[task.setvariable variable=USE_GKE_GCLOUD_AUTH_PLUGIN]True"

                echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json
                gcloud auth activate-service-account --key-file=$(Agent.TempDirectory)/gcp-key.json
                gcloud container clusters get-credentials ${{ parameters.clusterName }} \
                  --region $(CLUSTER_LOCATION) \
                  --project $(GCP_PROJECT_ID)

          - task: Bash@3
            displayName: 'Delete License'
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete secret eck-trial-license -n elastic-system || true

          - task: Bash@3
            displayName: 'Delete ECK Operator'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete -f https://download.elastic.co/downloads/eck/$(ECK_OPERATOR_VERSION)/operator.yaml || true

          - task: Bash@3
            displayName: 'Delete ECK CRDs'
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete -f https://download.elastic.co/downloads/eck/$(ECK_OPERATOR_VERSION)/crds.yaml || true

          - task: Bash@3
            displayName: 'Delete Namespaces'
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                export USE_GKE_GCLOUD_AUTH_PLUGIN=True
                kubectl delete namespace elastic-system elastic-stack || true
