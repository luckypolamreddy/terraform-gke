###############################################################################
# Sync Kibana Credentials → GCP Secret Manager
#
# Reads ECK-generated 'elastic' user password, pushes to Secret Manager.
# Anyone with gcloud access can get Kibana login — no kubectl needed.
#
# CHANGE: GCP_PROJECT_ID and GCP_SECRET_ID below
###############################################################################
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-kibana-creds
  namespace: elastic-stack
  labels:
    app.kubernetes.io/part-of: elastic-stack
    app.kubernetes.io/component: creds-sync
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: elastic-stack
        app.kubernetes.io/component: creds-sync
    spec:
      serviceAccountName: eck-operations
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-kibana
          image: curlimages/curl:8.11.0
          command:
            - sh
            - -c
            - |
              until curl -s "http://kibana-kb-http.elastic-stack.svc:5601/api/status" \
                | grep -q '"level":"available"'; do
                echo "Waiting for Kibana..."; sleep 15
              done

      containers:
        - name: sync
          image: google/cloud-sdk:slim
          env:
            - name: GCP_PROJECT_ID
              value: "gcp-project-a-id"                        # CHANGE
            - name: GCP_SECRET_ID
              value: "elastic-stack-kibana-credentials"
          command:
            - bash
            - -c
            - |
              set -e
              ES_PASS=$(cat /mnt/elastic-user/elastic)

              CREDS_JSON="{\"username\":\"elastic\",\"password\":\"${ES_PASS}\",\"kibana_url\":\"http://kibana-kb-http.elastic-stack.svc:5601\",\"elasticsearch_url\":\"http://elasticsearch-es-http.elastic-stack.svc:9200\",\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

              # Authenticate
              if [ -f /mnt/gcp-key/key.json ]; then
                gcloud auth activate-service-account --key-file=/mnt/gcp-key/key.json --quiet
              fi
              gcloud config set project "${GCP_PROJECT_ID}" --quiet

              # Push to Secret Manager
              echo "${CREDS_JSON}" | gcloud secrets versions add "${GCP_SECRET_ID}" \
                --data-file=- --project="${GCP_PROJECT_ID}"

              echo "Credentials synced to ${GCP_PROJECT_ID}/${GCP_SECRET_ID}"
              echo "Retrieve with: gcloud secrets versions access latest --secret=${GCP_SECRET_ID}"

          volumeMounts:
            - name: elastic-user
              mountPath: /mnt/elastic-user
              readOnly: true
            - name: gcp-key
              mountPath: /mnt/gcp-key
              readOnly: true

      volumes:
        - name: elastic-user
          secret:
            secretName: elasticsearch-es-elastic-user
        - name: gcp-key
          secret:
            secretName: gcs-credentials
            items:
              - key: gcs.client.default.credentials_file
                path: key.json

---
###############################################################################
# CronJob: Daily sync (picks up password rotations)
###############################################################################
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-kibana-creds-daily
  namespace: elastic-stack
  labels:
    app.kubernetes.io/part-of: elastic-stack
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: elastic-stack
            app.kubernetes.io/component: creds-sync
        spec:
          serviceAccountName: eck-operations
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: google/cloud-sdk:slim
              env:
                - name: GCP_PROJECT_ID
                  value: "gcp-project-a-id"                     # CHANGE
                - name: GCP_SECRET_ID
                  value: "elastic-stack-kibana-credentials"
              command:
                - bash
                - -c
                - |
                  set -e
                  ES_PASS=$(cat /mnt/elastic-user/elastic)
                  CREDS="{\"username\":\"elastic\",\"password\":\"${ES_PASS}\",\"kibana_url\":\"http://kibana-kb-http.elastic-stack.svc:5601\",\"elasticsearch_url\":\"http://elasticsearch-es-http.elastic-stack.svc:9200\",\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
                  [ -f /mnt/gcp-key/key.json ] && gcloud auth activate-service-account --key-file=/mnt/gcp-key/key.json --quiet
                  gcloud config set project "${GCP_PROJECT_ID}" --quiet
                  echo "${CREDS}" | gcloud secrets versions add "${GCP_SECRET_ID}" --data-file=- --project="${GCP_PROJECT_ID}"
                  echo "Synced at $(date -u)"
              volumeMounts:
                - name: elastic-user
                  mountPath: /mnt/elastic-user
                  readOnly: true
                - name: gcp-key
                  mountPath: /mnt/gcp-key
                  readOnly: true
          volumes:
            - name: elastic-user
              secret:
                secretName: elasticsearch-es-elastic-user
            - name: gcp-key
              secret:
                secretName: gcs-credentials
                items:
                  - key: gcs.client.default.credentials_file
                    path: key.json
