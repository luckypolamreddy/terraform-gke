apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat-monitoring
  namespace: elastic-stack
spec:
  type: filebeat
  version: ${ES_VERSION}
  elasticsearchRef:
    name: ${ES_CLUSTER_NAME}
  kibanaRef:
    name: ${ES_CLUSTER_NAME}
  config:
    filebeat.inputs:
      # Elasticsearch logs
      - type: container
        paths:
          - /var/log/containers/${ES_CLUSTER_NAME}-es-*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"
      # Kibana logs
      - type: container
        paths:
          - /var/log/containers/${ES_CLUSTER_NAME}-kb-*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"
      # Elasticsearch slowlog
      - type: container
        paths:
          - /var/log/containers/${ES_CLUSTER_NAME}-es-*.log
        include_lines: ['slowlog']
        fields:
          log_type: slowlog
        fields_under_root: true

    processors:
      - add_cloud_metadata: {}
      - add_host_metadata: {}

    output.elasticsearch:
      hosts: ["https://${ES_CLUSTER_NAME}-es-http.elastic-stack.svc:9200"]
      username: "${MONITORING_USER}"
      password: "${MONITORING_PASSWORD}"
      ssl.verification_mode: "none"
      indices:
        - index: "filebeat-slowlog-%{+yyyy.MM.dd}"
          when.equals:
            log_type: slowlog
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        tolerations:
          - key: "elastic-role"
            operator: "Exists"
            effect: "NoSchedule"
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                memory: 200Mi
                cpu: 100m
              limits:
                memory: 400Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
              - name: varlogpods
                mountPath: /var/log/pods
              - name: varlibdockercontainers
                mountPath: /var/lib/docker/containers
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers
        dnsPolicy: ClusterFirstWithHostNet
        securityContext:
          runAsUser: 0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: elastic-stack
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
