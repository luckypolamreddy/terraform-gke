# Pipeline: ECK Dedicated Monitoring (Option B)
# Separate monitoring Elasticsearch cluster collects metrics from production cluster
# Includes: Monitoring ES+Kibana, Stack Monitoring, Metricbeat, Filebeat

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: deploy
    values:
      - deploy
      - destroy

  - name: project
    displayName: 'GCP Project'
    type: string
    default: project-a
    values:
      - project-a
      - project-b

  - name: clusterName
    displayName: 'GKE Cluster Name'
    type: string

  - name: clusterLocation
    displayName: 'GKE Cluster Location'
    type: string
    default: us-east1

  - name: esClusterName
    displayName: 'Production Elasticsearch Cluster Name'
    type: string
    default: elastic-prod

  - name: monitoringClusterName
    displayName: 'Monitoring Elasticsearch Cluster Name'
    type: string
    default: elastic-monitoring

  - name: monitoringNodeCount
    displayName: 'Monitoring ES Node Count'
    type: number
    default: 2

  - name: esVersion
    displayName: 'Elasticsearch/Beats Version'
    type: string
    default: '9.1.3'

variables:
  - group: gcp-credentials-${{ parameters.project }}

stages:
  - stage: DedicatedMonitoring
    displayName: 'Dedicated Monitoring - ${{ parameters.action }}'
    jobs:
      - deployment: MonitoringDedicated
        displayName: 'Dedicated Monitoring ${{ parameters.action }}'
        environment: '${{ parameters.project }}-eck'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Bash@3
                  displayName: 'Authenticate to GKE'
                  inputs:
                    targetType: inline
                    script: |
                      echo '$(GCP_SA_KEY)' > $(Agent.TempDirectory)/gcp-key.json
                      gcloud auth activate-service-account --key-file=$(Agent.TempDirectory)/gcp-key.json
                      gcloud container clusters get-credentials ${{ parameters.clusterName }} \
                        --region ${{ parameters.clusterLocation }} \
                        --project $(GCP_PROJECT_ID)

                # --- DEPLOY ---
                - ${{ if eq(parameters.action, 'deploy') }}:
                  # Deploy monitoring Elasticsearch cluster
                  - task: Bash@3
                    displayName: 'Deploy Monitoring Elasticsearch'
                    inputs:
                      targetType: inline
                      script: |
                        export MONITORING_CLUSTER_NAME="${{ parameters.monitoringClusterName }}"
                        export MONITORING_NODE_COUNT="${{ parameters.monitoringNodeCount }}"
                        export ES_VERSION="${{ parameters.esVersion }}"
                        envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-b-dedicated/monitoring-elasticsearch.yaml | kubectl apply -f -

                  - task: Bash@3
                    displayName: 'Wait for Monitoring ES Ready'
                    inputs:
                      targetType: inline
                      script: |
                        echo "Waiting for monitoring Elasticsearch..."
                        kubectl -n elastic-stack wait --for=jsonpath='{.status.health}'=green \
                          elasticsearch/${{ parameters.monitoringClusterName }} --timeout=600s
                    timeoutInMinutes: 12

                  # Configure stack monitoring to point to dedicated cluster
                  - task: Bash@3
                    displayName: 'Configure Stack Monitoring'
                    inputs:
                      targetType: inline
                      script: |
                        export ES_CLUSTER_NAME="${{ parameters.esClusterName }}"
                        export MONITORING_CLUSTER_NAME="${{ parameters.monitoringClusterName }}"
                        envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-b-dedicated/stack-monitoring.yaml | kubectl apply -f -

                  # Get credentials for beats
                  - task: Bash@3
                    displayName: 'Get Credentials'
                    name: getCreds
                    inputs:
                      targetType: inline
                      script: |
                        PASS=$(kubectl get secret ${{ parameters.esClusterName }}-es-elastic-user -n elastic-stack -o jsonpath='{.data.elastic}' | base64 -d)
                        echo "##vso[task.setvariable variable=MONITORING_PASSWORD;issecret=true;isOutput=true]$PASS"

                  # Deploy Metricbeat
                  - task: Bash@3
                    displayName: 'Deploy Metricbeat'
                    inputs:
                      targetType: inline
                      script: |
                        export ES_CLUSTER_NAME="${{ parameters.esClusterName }}"
                        export MONITORING_CLUSTER_NAME="${{ parameters.monitoringClusterName }}"
                        export ES_VERSION="${{ parameters.esVersion }}"
                        export MONITORING_USER="elastic"
                        export MONITORING_PASSWORD="$(getCreds.MONITORING_PASSWORD)"
                        envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-b-dedicated/metricbeat.yaml | kubectl apply -f -

                  # Deploy Filebeat
                  - task: Bash@3
                    displayName: 'Deploy Filebeat'
                    inputs:
                      targetType: inline
                      script: |
                        export ES_CLUSTER_NAME="${{ parameters.esClusterName }}"
                        export MONITORING_CLUSTER_NAME="${{ parameters.monitoringClusterName }}"
                        export ES_VERSION="${{ parameters.esVersion }}"
                        export MONITORING_USER="elastic"
                        export MONITORING_PASSWORD="$(getCreds.MONITORING_PASSWORD)"
                        envsubst < $(System.DefaultWorkingDirectory)/eck/monitoring/option-b-dedicated/filebeat.yaml | kubectl apply -f -

                  - task: Bash@3
                    displayName: 'Verify Monitoring'
                    inputs:
                      targetType: inline
                      script: |
                        echo "Monitoring cluster status:"
                        kubectl -n elastic-stack get elasticsearch ${{ parameters.monitoringClusterName }}
                        echo ""
                        echo "Beats status:"
                        kubectl -n elastic-stack get beat
                        echo ""
                        MONITORING_KB_IP=$(kubectl get svc ${{ parameters.monitoringClusterName }}-kb-http -n elastic-stack -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
                        echo "Monitoring Kibana URL: https://${MONITORING_KB_IP}:5601"

                # --- DESTROY ---
                - ${{ if eq(parameters.action, 'destroy') }}:
                  - task: Kubernetes@1
                    displayName: 'Delete Filebeat'
                    continueOnError: true
                    inputs:
                      command: delete
                      arguments: 'beat filebeat-dedicated -n elastic-stack'

                  - task: Kubernetes@1
                    displayName: 'Delete Metricbeat'
                    continueOnError: true
                    inputs:
                      command: delete
                      arguments: 'beat metricbeat-dedicated -n elastic-stack'

                  # Remove monitoring references from production cluster
                  - task: Bash@3
                    displayName: 'Remove Monitoring Config from Production'
                    continueOnError: true
                    inputs:
                      targetType: inline
                      script: |
                        kubectl -n elastic-stack patch elasticsearch ${{ parameters.esClusterName }} --type=merge -p '{"spec":{"monitoring":null}}'
                        kubectl -n elastic-stack patch kibana ${{ parameters.esClusterName }} --type=merge -p '{"spec":{"monitoring":null}}'

                  - task: Kubernetes@1
                    displayName: 'Delete Monitoring Kibana'
                    continueOnError: true
                    inputs:
                      command: delete
                      arguments: 'kibana ${{ parameters.monitoringClusterName }} -n elastic-stack'

                  - task: Kubernetes@1
                    displayName: 'Delete Monitoring Elasticsearch'
                    continueOnError: true
                    inputs:
                      command: delete
                      arguments: 'elasticsearch ${{ parameters.monitoringClusterName }} -n elastic-stack'

                  - task: Bash@3
                    displayName: 'Wait for Cleanup'
                    inputs:
                      targetType: inline
                      script: |
                        kubectl -n elastic-stack wait --for=delete elasticsearch/${{ parameters.monitoringClusterName }} --timeout=300s 2>/dev/null || true

                  - task: Kubernetes@1
                    displayName: 'Delete RBAC Resources'
                    continueOnError: true
                    inputs:
                      command: delete
                      arguments: 'clusterrolebinding metricbeat-dedicated filebeat-dedicated clusterrole metricbeat-dedicated filebeat-dedicated sa metricbeat-dedicated filebeat-dedicated -n elastic-stack'
