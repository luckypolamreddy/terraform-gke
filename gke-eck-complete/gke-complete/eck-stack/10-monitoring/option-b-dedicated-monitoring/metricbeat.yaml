###############################################################################
# OPTION B — Metricbeat (ships to dedicated monitoring cluster)
#
# Same as Option A but output goes to es-monitor, dashboards to kibana-monitor.
# Monitors the MAIN cluster but stores data separately.
###############################################################################
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: metricbeat
  namespace: elastic-stack
  labels:
    app.kubernetes.io/part-of: elastic-stack
    app.kubernetes.io/component: monitoring
spec:
  type: metricbeat
  version: 9.1.3

  # OUTPUT and DASHBOARDS go to monitoring cluster
  elasticsearchRef:
    name: es-monitor
    namespace: elastic-stack
  kibanaRef:
    name: kibana-monitor
    namespace: elastic-stack

  config:
    metricbeat.modules:
      # ── System metrics (every node) ──
      - module: system
        period: 30s
        metricsets:
          - cpu
          - load
          - memory
          - network
          - process
          - process_summary
          - socket_summary
          - filesystem
          - fsstat
        process.include_top_n:
          by_cpu: 10
          by_memory: 10
        processes: ['.*']

      - module: system
        period: 1m
        metricsets: [diskio]
        processors:
          - drop_event.when.regexp:
              system.diskio.name: '^(ram|loop|fd).*'

      # ── Elasticsearch metrics (from MAIN cluster) ──
      - module: elasticsearch
        period: 30s
        hosts: ["http://elasticsearch-es-http.elastic-stack.svc:9200"]
        username: "${MONITORED_ES_USERNAME}"
        password: "${MONITORED_ES_PASSWORD}"
        xpack.enabled: true
        metricsets:
          - node
          - node_stats
          - cluster_stats
          - index
          - index_summary
          - index_recovery
          - shard
          - pending_tasks
          - enrich

      - module: elasticsearch
        period: 5m
        hosts: ["http://elasticsearch-es-http.elastic-stack.svc:9200"]
        username: "${MONITORED_ES_USERNAME}"
        password: "${MONITORED_ES_PASSWORD}"
        xpack.enabled: true
        metricsets: [ml_job]

      # ── Kibana metrics (MAIN Kibana) ──
      - module: kibana
        period: 30s
        hosts: ["http://kibana-kb-http.elastic-stack.svc:5601"]
        username: "${MONITORED_ES_USERNAME}"
        password: "${MONITORED_ES_PASSWORD}"
        xpack.enabled: true
        metricsets: [stats, status]

      # ── Monitoring cluster health (monitor the monitor) ──
      - module: elasticsearch
        period: 60s
        hosts: ["http://es-monitor-es-http.elastic-stack.svc:9200"]
        username: "${MONITOR_ES_USERNAME}"
        password: "${MONITOR_ES_PASSWORD}"
        xpack.enabled: true
        metricsets: [cluster_stats, node_stats]

    processors:
      - add_cloud_metadata: {}
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          scope: node
      - add_host_metadata:
          netinfo.enabled: true

    # Output goes to MONITORING cluster
    output.elasticsearch:
      hosts: ["http://es-monitor-es-http.elastic-stack.svc:9200"]
      username: "${MONITOR_ES_USERNAME}"
      password: "${MONITOR_ES_PASSWORD}"

    setup.dashboards.enabled: true
    setup.kibana:
      host: "http://kibana-monitor-kb-http.elastic-stack.svc:5601"

  daemonSet:
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/part-of: elastic-stack
          app.kubernetes.io/component: metricbeat
      spec:
        serviceAccountName: metricbeat
        automountServiceAccountToken: true
        tolerations:
          - key: "elastic.co/role"
            operator: "Exists"
            effect: "NoSchedule"
        containers:
          - name: metricbeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              # Credentials for MAIN cluster (to read metrics)
              - name: MONITORED_ES_USERNAME
                value: "elastic"
              - name: MONITORED_ES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: elasticsearch-es-elastic-user
                    key: elastic
              # Credentials for MONITORING cluster (to write data)
              - name: MONITOR_ES_USERNAME
                value: "elastic"
              - name: MONITOR_ES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: es-monitor-es-elastic-user
                    key: elastic
            resources:
              requests:
                memory: 300Mi
                cpu: 100m
              limits:
                memory: 500Mi
                cpu: 200m
            volumeMounts:
              - { name: proc, mountPath: /hostfs/proc, readOnly: true }
              - { name: sys, mountPath: /hostfs/sys, readOnly: true }
              - { name: root, mountPath: /hostfs, readOnly: true }
        volumes:
          - { name: proc, hostPath: { path: /proc } }
          - { name: sys, hostPath: { path: /sys } }
          - { name: root, hostPath: { path: / } }

---
# RBAC (same as Option A)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metricbeat
  namespace: elastic-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metricbeat-cluster-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metricbeat-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metricbeat-cluster-role
subjects:
  - kind: ServiceAccount
    name: metricbeat
    namespace: elastic-stack
