# Reusable template for Terraform init, plan, apply/destroy
parameters:
  - name: action
    type: string
    values:
      - apply
      - destroy
  - name: workingDirectory
    type: string
  - name: tfvarsFile
    type: string
  - name: backendBucket
    type: string
  - name: backendPrefix
    type: string
  - name: credentialsFile
    type: string
    default: '$(Agent.TempDirectory)/gcp-key.json'
  - name: extraVars
    type: string
    default: ''

steps:
  - task: Bash@3
    displayName: 'Write GCP credentials file'
    inputs:
      targetType: inline
      script: echo '$(GCP_SA_KEY)' > ${{ parameters.credentialsFile }}

  - task: TerraformInstaller@1
    displayName: 'Install Terraform 1.14.6'
    inputs:
      terraformVersion: "1.14.6"

  - task: Bash@3
    displayName: 'Debug: Show checked-out code'
    inputs:
      targetType: inline
      workingDirectory: ${{ parameters.workingDirectory }}
      script: |
        echo "=== Git commit ==="
        git log --oneline -1
        echo "=== Terraform files in working directory ==="
        ls -la *.tf
        echo "=== locals block (should show backup_plan_name auto-generation) ==="
        grep -A3 'locals' main.tf || echo "No locals block found"
        echo "=== Root variables (should NOT contain backup_plan_name) ==="
        grep 'variable.*backup_plan_name' variables.tf && echo "ERROR: backup_plan_name is still a root variable!" || echo "OK: backup_plan_name is not a root variable"

  - task: Bash@3
    displayName: 'Terraform Init'
    inputs:
      targetType: inline
      workingDirectory: ${{ parameters.workingDirectory }}
      script: |
        export GOOGLE_APPLICATION_CREDENTIALS="${{ parameters.credentialsFile }}"
        terraform init -input=false \
          -backend-config="bucket=${{ parameters.backendBucket }}" \
          -backend-config="prefix=${{ parameters.backendPrefix }}" \
          -backend-config="credentials=${{ parameters.credentialsFile }}"

  - task: Bash@3
    displayName: 'Terraform Plan (${{ parameters.action }})'
    inputs:
      targetType: inline
      workingDirectory: ${{ parameters.workingDirectory }}
      script: |
        export GOOGLE_APPLICATION_CREDENTIALS="${{ parameters.credentialsFile }}"
        DESTROY_FLAG=""
        if [ "${{ parameters.action }}" = "destroy" ]; then
          DESTROY_FLAG="-destroy"
        fi

        terraform plan -input=false \
          -var-file="${{ parameters.tfvarsFile }}" \
          -var="credentials_file=${{ parameters.credentialsFile }}" \
          ${{ parameters.extraVars }} \
          $DESTROY_FLAG \
          -out=tfplan

  - ${{ if ne(parameters.action, 'plan') }}:
    - task: Bash@3
      displayName: 'Terraform ${{ parameters.action }}'
      inputs:
        targetType: inline
        workingDirectory: ${{ parameters.workingDirectory }}
        script: |
          export GOOGLE_APPLICATION_CREDENTIALS="${{ parameters.credentialsFile }}"
          terraform apply tfplan
