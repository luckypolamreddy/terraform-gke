# OIDC Client Secret for Elasticsearch
# This secret stores the Azure AD OIDC client credentials.
#
# IMPORTANT: Do NOT commit actual secrets to git.
# Use one of these methods to create the secret:
#
# Option A: Create from GCP Secret Manager (recommended)
#   CLIENT_ID=$(gcloud secrets versions access latest --secret=eck-oidc-client-id --project=$PROJECT_ID)
#   CLIENT_SECRET=$(gcloud secrets versions access latest --secret=eck-oidc-client-secret --project=$PROJECT_ID)
#   kubectl create secret generic oidc-client-secret \
#     --namespace=elastic-stack \
#     --from-literal=client-id=$CLIENT_ID \
#     --from-literal=client-secret=$CLIENT_SECRET
#
# Option B: Apply this template after replacing placeholders
#
apiVersion: v1
kind: Secret
metadata:
  name: oidc-client-secret
  namespace: elastic-stack
  labels:
    app.kubernetes.io/name: elasticsearch-sso
    app.kubernetes.io/component: oidc
type: Opaque
stringData:
  # Replace these with actual values from Azure AD App Registration
  client-id: "REPLACE_WITH_AZURE_AD_CLIENT_ID"
  client-secret: "REPLACE_WITH_AZURE_AD_CLIENT_SECRET"
