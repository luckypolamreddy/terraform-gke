# Pipeline: Foundation (VPC, GCS Bucket)
# These resources persist across cluster lifecycles
#
# Actions:
#   apply         - creates/updates all foundation infrastructure
#   destroy-all   - tears down everything (VPC + GCS bucket)
#   destroy-bucket - tears down only the GCS snapshot bucket
#   destroy-vpc   - tears down only the VPC
#
# Stages:
#   1. Plan (always runs) - dry run showing what would change
#   2. Apply (only when action=apply) - creates/updates infrastructure
#   3. Destroy (when action starts with 'destroy') - targeted teardown

trigger: none

parameters:
  - name: action
    displayName: 'Action'
    type: string
    default: apply
    values:
      - apply
      - destroy-all
      - destroy-bucket
      - destroy-vpc

  - name: project
    displayName: 'GCP Project'
    type: string
    default: pg-us-n-app-259723
    values:
      - pg-us-n-app-259723
      - pg-us-e-app-012345

  - name: vpcName
    displayName: 'VPC Name (leave empty to use tfvars default)'
    type: string
    default: ''

  - name: gcsBucketName
    displayName: 'GCS Bucket Name (leave empty to use tfvars default)'
    type: string
    default: ''

variables:
  - group: gcp-credentials-${{ parameters.project }}
  # Variable group should contain: GCP_SA_KEY, TF_STATE_BUCKET

pool:
  vmImage: 'ubuntu-latest'

stages:
  # Stage 1: Plan (always runs - dry run)
  - stage: Plan
    displayName: 'Terraform Plan (dry run)'
    jobs:
      - deployment: TerraformPlan
        displayName: 'Terraform Plan'
        environment: '${{ parameters.project }}-foundation'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Bash@3
                  name: buildVars
                  displayName: 'Build variable overrides'
                  inputs:
                    targetType: inline
                    script: |
                      EXTRA=""
                      if [ -n "${{ parameters.vpcName }}" ]; then
                        EXTRA="$EXTRA -var=vpc_name=${{ parameters.vpcName }}"
                      fi
                      if [ -n "${{ parameters.gcsBucketName }}" ]; then
                        EXTRA="$EXTRA -var=gcs_bucket_name=${{ parameters.gcsBucketName }}"
                      fi

                      # Include -target for selective destroy so plan shows correct scope
                      ACTION="${{ parameters.action }}"
                      if [ "$ACTION" = "destroy-bucket" ]; then
                        EXTRA="$EXTRA -target=module.gcs_bucket"
                      elif [ "$ACTION" = "destroy-vpc" ]; then
                        EXTRA="$EXTRA -target=module.vpc"
                      fi

                      echo "##vso[task.setvariable variable=EXTRA_VARS;isOutput=true]$EXTRA"

                - template: templates/terraform-plan-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/foundation'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/foundation.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'foundation/${{ parameters.project }}'
                    extraVars: '$(buildVars.EXTRA_VARS)'

  # Stage 2: Apply (only when action=apply)
  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
    jobs:
      - deployment: TerraformApply
        displayName: 'Terraform Apply'
        environment: '${{ parameters.project }}-foundation'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Bash@3
                  name: buildVars
                  displayName: 'Build variable overrides'
                  inputs:
                    targetType: inline
                    script: |
                      EXTRA=""
                      if [ -n "${{ parameters.vpcName }}" ]; then
                        EXTRA="$EXTRA -var=vpc_name=${{ parameters.vpcName }}"
                      fi
                      if [ -n "${{ parameters.gcsBucketName }}" ]; then
                        EXTRA="$EXTRA -var=gcs_bucket_name=${{ parameters.gcsBucketName }}"
                      fi
                      echo "##vso[task.setvariable variable=EXTRA_VARS;isOutput=true]$EXTRA"

                - template: templates/terraform-apply-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/foundation'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/foundation.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'foundation/${{ parameters.project }}'
                    extraVars: '$(buildVars.EXTRA_VARS)'

  # Stage 3: Destroy (when action starts with 'destroy')
  - stage: Destroy
    displayName: 'Terraform Destroy (${{ parameters.action }})'
    dependsOn: Plan
    condition: and(succeeded(), startsWith('${{ parameters.action }}', 'destroy'))
    jobs:
      - deployment: TerraformDestroy
        displayName: 'Terraform Destroy (${{ parameters.action }})'
        environment: '${{ parameters.project }}-foundation'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Bash@3
                  name: buildVars
                  displayName: 'Build variable overrides and target'
                  inputs:
                    targetType: inline
                    script: |
                      EXTRA=""
                      if [ -n "${{ parameters.vpcName }}" ]; then
                        EXTRA="$EXTRA -var=vpc_name=${{ parameters.vpcName }}"
                      fi
                      if [ -n "${{ parameters.gcsBucketName }}" ]; then
                        EXTRA="$EXTRA -var=gcs_bucket_name=${{ parameters.gcsBucketName }}"
                      fi

                      # Selective destroy using -target
                      ACTION="${{ parameters.action }}"
                      if [ "$ACTION" = "destroy-bucket" ]; then
                        EXTRA="$EXTRA -target=module.gcs_bucket"
                        echo ">> Destroying GCS bucket only"
                      elif [ "$ACTION" = "destroy-vpc" ]; then
                        EXTRA="$EXTRA -target=module.vpc"
                        echo ">> Destroying VPC only"
                      else
                        echo ">> Destroying ALL foundation resources"
                      fi

                      echo "##vso[task.setvariable variable=EXTRA_VARS;isOutput=true]$EXTRA"

                - template: templates/terraform-destroy-steps.yml
                  parameters:
                    workingDirectory: '$(System.DefaultWorkingDirectory)/stacks/foundation'
                    tfvarsFile: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.project }}/foundation.tfvars'
                    backendBucket: '$(TF_STATE_BUCKET)'
                    backendPrefix: 'foundation/${{ parameters.project }}'
                    extraVars: '$(buildVars.EXTRA_VARS)'
