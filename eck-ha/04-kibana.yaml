apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: _KIBANA_NAME_
  namespace: _NAMESPACE_
spec:
  version: _ES_OPERATOR_VERSION_
  count: _KIBANA_NODES_
  elasticsearchRef:
    name: _ES_NAME_

  # HTTPS with auto-generated self-signed certificates
  http:
    tls:
      selfSignedCertificate:
        disabled: false
    service:
      spec:
        type: LoadBalancer

  # Self-monitoring
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: _ES_NAME_
          namespace: _NAMESPACE_
    logs:
      elasticsearchRefs:
        - name: _ES_NAME_
          namespace: _NAMESPACE_

  podTemplate:
    metadata:
      labels:
        elastic-role: kibana
    spec:
      # Deploy on general-pool (no taints, no tolerations needed)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: In
                    values:
                      - general-pool
        # Spread kibana pods across different nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    kibana.k8s.elastic.co/name: _KIBANA_NAME_
                topologyKey: kubernetes.io/hostname
      containers:
        - name: kibana
          resources:
            requests:
              memory: _KIBANA_MEMORY_Gi
              cpu: _KIBANA_CPU_
            limits:
              memory: _KIBANA_MEMORY_LIMIT_Gi
              cpu: _KIBANA_CPU_LIMIT_
