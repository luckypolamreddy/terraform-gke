###############################################################################
# OPTION B — Dedicated Monitoring Cluster
#
# USE WHEN: Production-critical environments where you need monitoring to
# stay alive even if the main cluster is under stress or down.
#
# DEPLOYS:
#   - es-monitor: Small 2-node ES cluster (single role: master+data)
#   - kibana-monitor: 1 Kibana instance for monitoring dashboards
#   Both run on system-pool (no taints, no nodeSelector needed)
#
# RESOURCE FOOTPRINT:
#   2× ES monitor nodes:  2Gi RAM each, 1 CPU, 50Gi storage
#   1× Kibana monitor:    1Gi RAM, 0.5 CPU
#   Total extra:          ~5Gi RAM, 2.5 CPU on system-pool
#
# The main cluster (elasticsearch) ships monitoring data TO es-monitor.
# Stack Monitoring in kibana-monitor shows main cluster health.
# If the main cluster goes down, monitoring cluster still works.
###############################################################################

# =========================================================================
# 1. Monitoring Elasticsearch Cluster (small, 2-node)
# =========================================================================
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: es-monitor
  namespace: elastic-stack
  labels:
    app.kubernetes.io/part-of: elastic-stack
    app.kubernetes.io/component: monitoring
spec:
  version: 9.1.3

  http:
    service:
      spec:
        type: ClusterIP    # Internal only — no external access needed
    tls:
      selfSignedCertificate:
        disabled: true

  transport:
    tls: {}

  nodeSets:
    - name: monitor
      count: 2
      config:
        node.roles: ["master", "data", "ingest"]

        # Monitoring indices retention — auto-cleanup old data
        xpack.monitoring.collection.enabled: true
        xpack.monitoring.history.duration: "7d"

        # Security
        xpack.security.enabled: true

      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/component: monitoring
        spec:
          initContainers:
            - name: sysctl
              securityContext:
                privileged: true
                runAsUser: 0
              command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]

          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 2Gi
                  cpu: "0.5"
                limits:
                  memory: 2Gi
                  cpu: "1"
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms1g -Xmx1g"

          # No nodeSelector → lands on system-pool (untainted)
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        elasticsearch.k8s.elastic.co/cluster-name: es-monitor
                    topologyKey: kubernetes.io/hostname

      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: premium-rwo
            resources:
              requests:
                storage: 50Gi

---
# =========================================================================
# 2. Monitoring Kibana (single instance)
# =========================================================================
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana-monitor
  namespace: elastic-stack
  labels:
    app.kubernetes.io/part-of: elastic-stack
    app.kubernetes.io/component: monitoring
spec:
  version: 9.1.3
  count: 1    # Single instance is fine for monitoring

  elasticsearchRef:
    name: es-monitor
    namespace: elastic-stack

  http:
    service:
      spec:
        type: LoadBalancer    # Separate LB for monitoring UI
    tls:
      selfSignedCertificate:
        disabled: true

  # ── Encryption keys (auto-generated by deploy-monitoring.sh) ──
  secureSettings:
    - secretName: kibana-monitor-encryption-keys

  config:
    server.name: "kibana-monitor"
    xpack.security.session.idleTimeout: "1h"
    xpack.security.session.lifespan: "24h"

  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/component: monitoring
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              memory: 1Gi
              cpu: "0.5"
            limits:
              memory: 1Gi
              cpu: "1"
