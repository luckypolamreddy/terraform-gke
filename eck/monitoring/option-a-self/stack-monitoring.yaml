# Enable Stack Monitoring - patches existing ES and Kibana to send metrics/logs to self
# Uses strategic merge patch to only update the monitoring section without touching other fields
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: ${ES_CLUSTER_NAME}
  namespace: elastic-stack
spec:
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: ${ES_CLUSTER_NAME}
    logs:
      elasticsearchRefs:
        - name: ${ES_CLUSTER_NAME}
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: ${KIBANA_NAME}
  namespace: elastic-stack
spec:
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: ${ES_CLUSTER_NAME}
    logs:
      elasticsearchRefs:
        - name: ${ES_CLUSTER_NAME}
