apiVersion: _KIBANA_NAME_.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: _KIBANA_NAME_
  namespace: _NAMESPACE_
spec:
  http:
    service:
      spec:
        type: LoadBalancer
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: _ES_NAME_
          namespace: _NAMESPACE_
    logs:
      elasticsearchRefs:
        - name: _ES_NAME_
          namespace: _NAMESPACE_
  version: _ES_OPERATOR_VERSION_
  count: _KIBANA_NODES_
  elasticsearchRef:
    name: _ES_NAME_
  podTemplate:
    spec:
      containers:
        - name: _KIBANA_NAME_
          resources:
            requests:
              memory: _KIBANA_MEMORY_Gi
              cpu: _KIBANA_CPU_
            limits:
              memory: _KIBANA_MEMORY_LIMIT_Gi
              cpu: _KIBANA_CPU_LIMIT_
