# GCS credentials for Elasticsearch snapshot/restore
# The actual key content is injected by the ADO pipeline
# using: kubectl create secret generic gcs-credentials \
#   --from-file=gcs.client.default.credentials_file=<key-file> \
#   -n elastic-stack
apiVersion: v1
kind: Secret
metadata:
  name: gcs-credentials
  namespace: elastic-stack
  labels:
    app: elasticsearch
    purpose: snapshot-restore
type: Opaque
# data is populated by the pipeline at deploy time
