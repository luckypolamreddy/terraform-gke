# =============================================================================
# Cluster Pipeline — Subnet + GKE Cluster
# Actions: plan, apply, destroy
#
# RUNTIME OVERRIDES: Parameters with "(override)" let you change values
# from .tfvars at pipeline run time. Leave empty to use .tfvars defaults.
#
# DESTROY FLOW:
#   1. PAUSE backup plan (can't delete plans with existing backups)
#   2. Disable deletion protection
#   3. Terraform destroy (cluster + subnet)
# =============================================================================
trigger: none

parameters:
  - name: gcpProject
    displayName: "GCP Project"
    type: string
    values:
      - project-a
      - project-b

  - name: clusterConfig
    displayName: "Cluster Config File (cluster-X.tfvars)"
    type: string
    values:
      - cluster-1
      - cluster-2
      - cluster-3

  - name: action
    displayName: "Action"
    type: string
    default: "plan"
    values:
      - plan
      - apply
      - destroy

  - name: kubernetesVersion
    displayName: "Kubernetes Version"
    type: string
    default: "1.30.5-gke.1443001"
    values:
      - "1.28.15-gke.1190000"
      - "1.29.10-gke.1227000"
      - "1.30.5-gke.1443001"
      - "1.31.1-gke.1846000"

  # --- Runtime overrides (empty = use .tfvars value) ---
  - name: clusterName
    displayName: "Cluster Name (override)"
    type: string
    default: ""

  - name: subnetName
    displayName: "Subnet Name (override)"
    type: string
    default: ""

  - name: machineType
    displayName: "Machine Type (override — applies to ALL node pools)"
    type: string
    default: ""

  - name: tfVersion
    displayName: "Terraform Version"
    type: string
    default: "1.9.0"

variables:
  - group: "gcp-${{ parameters.gcpProject }}-credentials"
  - name: stackDir
    value: "$(System.DefaultWorkingDirectory)/stacks/cluster"
  - name: backupStackDir
    value: "$(System.DefaultWorkingDirectory)/stacks/backup"
  - name: clusterVars
    value: "$(System.DefaultWorkingDirectory)/environments/${{ parameters.gcpProject }}/${{ parameters.clusterConfig }}.tfvars"
  - name: backupVars
    value: "$(System.DefaultWorkingDirectory)/environments/${{ parameters.gcpProject }}/backup-${{ parameters.clusterConfig }}.tfvars"

pool:
  vmImage: "ubuntu-latest"

# =============================================================================
#  PLAN / APPLY
# =============================================================================
stages:
  - stage: Plan
    displayName: "Plan — ${{ parameters.clusterConfig }} (${{ parameters.gcpProject }})"
    condition: ne('${{ parameters.action }}', 'destroy')
    jobs:
      - job: Plan
        steps:
          - checkout: self

          - script: |
              VARS="-var=kubernetes_version=$(K8S_VER)"
              [ -n "$CLUSTER_NAME" ]  && VARS="$VARS -var=cluster_name=$CLUSTER_NAME"
              [ -n "$SUBNET_NAME" ]   && VARS="$VARS -var=subnet_name=$SUBNET_NAME"
              [ -n "$MACHINE_TYPE" ]  && VARS="$VARS -var=machine_type_override=$MACHINE_TYPE"
              echo "##vso[task.setvariable variable=EXTRA_TF_VARS]$VARS"
              echo "Runtime overrides: $VARS"
            displayName: "Build override vars"
            env:
              K8S_VER:      ${{ parameters.kubernetesVersion }}
              CLUSTER_NAME: ${{ parameters.clusterName }}
              SUBNET_NAME:  ${{ parameters.subnetName }}
              MACHINE_TYPE: ${{ parameters.machineType }}

          - template: templates/terraform-init-plan.yml
            parameters:
              workingDir:  $(stackDir)
              stateBucket: $(TF_STATE_BUCKET)
              statePrefix: "clusters/${{ parameters.clusterConfig }}"
              varsFile:    $(clusterVars)
              extraVars:   $(EXTRA_TF_VARS)
              tfVersion:   ${{ parameters.tfVersion }}

  - stage: Apply
    displayName: "Apply — ${{ parameters.clusterConfig }} (${{ parameters.gcpProject }})"
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
    jobs:
      - deployment: Apply
        environment: "gcp-${{ parameters.gcpProject }}-clusters"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    VARS="-var=kubernetes_version=$(K8S_VER)"
                    [ -n "$CLUSTER_NAME" ]  && VARS="$VARS -var=cluster_name=$CLUSTER_NAME"
                    [ -n "$SUBNET_NAME" ]   && VARS="$VARS -var=subnet_name=$SUBNET_NAME"
                    [ -n "$MACHINE_TYPE" ]  && VARS="$VARS -var=machine_type_override=$MACHINE_TYPE"
                    echo "##vso[task.setvariable variable=EXTRA_TF_VARS]$VARS"
                  displayName: "Build override vars"
                  env:
                    K8S_VER:      ${{ parameters.kubernetesVersion }}
                    CLUSTER_NAME: ${{ parameters.clusterName }}
                    SUBNET_NAME:  ${{ parameters.subnetName }}
                    MACHINE_TYPE: ${{ parameters.machineType }}

                - template: templates/terraform-init-plan.yml
                  parameters:
                    workingDir:  $(stackDir)
                    stateBucket: $(TF_STATE_BUCKET)
                    statePrefix: "clusters/${{ parameters.clusterConfig }}"
                    varsFile:    $(clusterVars)
                    extraVars:   $(EXTRA_TF_VARS)
                    tfVersion:   ${{ parameters.tfVersion }}

                - template: templates/terraform-apply.yml
                  parameters:
                    workingDir: $(stackDir)

# =============================================================================
#  DESTROY — 3-stage safe sequence
# =============================================================================

  # Stage 1: Pause backup plan
  - stage: PauseBackup
    displayName: "1/3  Pause Backup — ${{ parameters.clusterConfig }}"
    condition: eq('${{ parameters.action }}', 'destroy')
    jobs:
      - deployment: PauseBackup
        environment: "gcp-${{ parameters.gcpProject }}-destroy"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: "${{ parameters.tfVersion }}"

                - script: |
                    echo '$(GCP_SA_KEY_JSON)' > $(Agent.TempDirectory)/gcp-key.json
                  displayName: "Write credentials"
                  env:
                    GCP_SA_KEY_JSON: $(GCP_SA_KEY_JSON)

                - script: |
                    terraform init \
                      -backend-config="bucket=$(TF_STATE_BUCKET)" \
                      -backend-config="prefix=backups/${{ parameters.clusterConfig }}" \
                      -backend-config="credentials=$(Agent.TempDirectory)/gcp-key.json" \
                      -input=false -no-color

                    terraform apply \
                      -var-file="$(backupVars)" \
                      -var="credentials=$(cat $(Agent.TempDirectory)/gcp-key.json)" \
                      -var="paused=true" \
                      -auto-approve -input=false -no-color
                  displayName: "Terraform Apply — paused=true"
                  workingDirectory: $(backupStackDir)
                  continueOnError: true

  # Stage 2: Disable deletion protection
  - stage: DisableProtection
    displayName: "2/3  Disable Deletion Protection — ${{ parameters.clusterConfig }}"
    dependsOn: PauseBackup
    condition: eq('${{ parameters.action }}', 'destroy')
    jobs:
      - job: DisableProtection
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: "${{ parameters.tfVersion }}"

          - script: |
              echo '$(GCP_SA_KEY_JSON)' > $(Agent.TempDirectory)/gcp-key.json
            displayName: "Write credentials"
            env:
              GCP_SA_KEY_JSON: $(GCP_SA_KEY_JSON)

          - script: |
              VARS="-var=kubernetes_version=${{ parameters.kubernetesVersion }}"
              VARS="$VARS -var=deletion_protection=false"
              [ -n "$CLUSTER_NAME" ]  && VARS="$VARS -var=cluster_name=$CLUSTER_NAME"
              [ -n "$SUBNET_NAME" ]   && VARS="$VARS -var=subnet_name=$SUBNET_NAME"
              [ -n "$MACHINE_TYPE" ]  && VARS="$VARS -var=machine_type_override=$MACHINE_TYPE"

              terraform init \
                -backend-config="bucket=$(TF_STATE_BUCKET)" \
                -backend-config="prefix=clusters/${{ parameters.clusterConfig }}" \
                -backend-config="credentials=$(Agent.TempDirectory)/gcp-key.json" \
                -input=false -no-color

              terraform apply \
                -var-file="$(clusterVars)" \
                -var="credentials=$(cat $(Agent.TempDirectory)/gcp-key.json)" \
                $VARS \
                -auto-approve -input=false -no-color
            displayName: "Set deletion_protection = false"
            workingDirectory: $(stackDir)
            env:
              CLUSTER_NAME: ${{ parameters.clusterName }}
              SUBNET_NAME:  ${{ parameters.subnetName }}
              MACHINE_TYPE: ${{ parameters.machineType }}

  # Stage 3: Destroy cluster + subnet
  - stage: DestroyCluster
    displayName: "3/3  Destroy Cluster + Subnet — ${{ parameters.clusterConfig }}"
    dependsOn: DisableProtection
    condition: eq('${{ parameters.action }}', 'destroy')
    jobs:
      - deployment: Destroy
        environment: "gcp-${{ parameters.gcpProject }}-destroy"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    VARS="-var=kubernetes_version=${{ parameters.kubernetesVersion }}"
                    VARS="$VARS -var=deletion_protection=false"
                    [ -n "$CLUSTER_NAME" ]  && VARS="$VARS -var=cluster_name=$CLUSTER_NAME"
                    [ -n "$SUBNET_NAME" ]   && VARS="$VARS -var=subnet_name=$SUBNET_NAME"
                    [ -n "$MACHINE_TYPE" ]  && VARS="$VARS -var=machine_type_override=$MACHINE_TYPE"
                    echo "##vso[task.setvariable variable=EXTRA_TF_VARS]$VARS"
                  displayName: "Build override vars"
                  env:
                    CLUSTER_NAME: ${{ parameters.clusterName }}
                    SUBNET_NAME:  ${{ parameters.subnetName }}
                    MACHINE_TYPE: ${{ parameters.machineType }}

                - template: templates/terraform-destroy.yml
                  parameters:
                    workingDir:  $(stackDir)
                    stateBucket: $(TF_STATE_BUCKET)
                    statePrefix: "clusters/${{ parameters.clusterConfig }}"
                    varsFile:    $(clusterVars)
                    extraVars:   $(EXTRA_TF_VARS)
                    tfVersion:   ${{ parameters.tfVersion }}
