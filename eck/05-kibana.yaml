apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: ${ES_CLUSTER_NAME}
  namespace: elastic-stack
spec:
  version: ${ES_VERSION}
  count: 2

  elasticsearchRef:
    name: ${ES_CLUSTER_NAME}

  config:
    # Server settings
    server.name: kibana
    server.publicBaseUrl: "https://${KIBANA_EXTERNAL_HOST}:5601"

    # Logging
    logging.root.level: info
    logging.appenders.default:
      type: console
      layout:
        type: json

    # Security
    xpack.security.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
    xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_SAVED_OBJECTS_KEY}"
    xpack.reporting.encryptionKey: "${KIBANA_REPORTING_KEY}"

    # Stack monitoring
    monitoring.kibana.collection.enabled: true

  podTemplate:
    metadata:
      labels:
        app: kibana
    spec:
      # Kibana runs on master-kibana pool (same as ES masters)
      tolerations:
        - key: "elastic-role"
          value: "master-kibana"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: elastic-role
                    operator: In
                    values:
                      - master-kibana
      containers:
        - name: kibana
          resources:
            requests:
              memory: ${KIBANA_MEMORY}
              cpu: "${KIBANA_CPU}"
            limits:
              memory: ${KIBANA_MEMORY}

  # External LoadBalancer for Kibana
  http:
    service:
      spec:
        type: LoadBalancer
    tls:
      selfSignedCertificate:
        disabled: false
