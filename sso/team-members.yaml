# Team Members Configuration
# This file manages SSO access for all team members across GKE and ECK clusters.
#
# Each member has:
#   - name: Display name
#   - gcp_email: @gcp.pwc.com email for GKE/GCP access
#   - pwc_email: @pwc.com email for Azure AD / Kibana SSO
#   - role: admin | editor | viewer (maps to K8s and ES roles)
#
# Roles:
#   admin  - Full cluster admin, Kibana superuser
#   editor - Deploy workloads, edit Kibana dashboards/indices
#   viewer - Read-only access to namespaces and Kibana dashboards

