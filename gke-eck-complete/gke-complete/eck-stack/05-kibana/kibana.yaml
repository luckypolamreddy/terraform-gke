###############################################################################
# Kibana 9.1.3
#
# SCHEDULING: No nodeSelector/tolerations → lands on system-pool
#
# TLS: Disabled on HTTP. Handle TLS at ingress controller level later.
#      ECK still manages internal transport TLS between ES nodes automatically.
#
# ENCRYPTION KEYS (NOT SSL certs):
#   Kibana needs 3 encryption keys for HA (2 replicas sharing state):
#     - xpack.security.encryptionKey          → encrypts session cookies
#     - xpack.encryptedSavedObjects.encryptionKey → encrypts saved objects
#     - xpack.reporting.encryptionKey         → encrypts report data
#   These are just random hex strings. deploy.sh auto-generates them as a
#   K8s secret before applying this file. You never create them manually.
###############################################################################
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: elastic-stack
  labels:
    app.kubernetes.io/part-of: elastic-stack
spec:
  version: 9.1.3
  count: 2    # HA: 2 replicas behind LoadBalancer

  elasticsearchRef:
    name: elasticsearch
    namespace: elastic-stack

  # ── HTTP: External LoadBalancer, NO TLS ──
  # TLS disabled here. Add TLS at ingress controller level later.
  http:
    service:
      spec:
        type: LoadBalancer
    tls:
      selfSignedCertificate:
        disabled: true

  # ── Encryption keys loaded from K8s secret (auto-generated by deploy.sh) ──
  secureSettings:
    - secretName: kibana-encryption-keys

  config:
    server.name: "kibana"

    # Session management
    xpack.security.session.idleTimeout: "1h"
    xpack.security.session.lifespan: "24h"

    # Logging
    logging.root.level: "info"

  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/component: kibana
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              memory: 2Gi
              cpu: "0.5"
            limits:
              memory: 2Gi
              cpu: "1"

      # No nodeSelector/tolerations → system-pool (untainted)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    kibana.k8s.elastic.co/name: kibana
                topologyKey: kubernetes.io/hostname
