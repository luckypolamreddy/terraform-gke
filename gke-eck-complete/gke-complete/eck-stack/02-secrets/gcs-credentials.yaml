###############################################################################
# GCS Service Account Credentials for Elasticsearch Snapshots
#
# CREATE WITH (recommended):
#   kubectl create secret generic gcs-credentials \
#     --from-file=gcs.client.default.credentials_file=/path/to/sa-key.json \
#     -n elastic-stack
#
# OR edit the base64 value below and apply this YAML:
#   cat /path/to/sa-key.json | base64 -w 0   # Linux
#   cat /path/to/sa-key.json | base64         # macOS
#
# IAM: roles/storage.objectAdmin on the GCS bucket
#      roles/secretmanager.secretVersionAdder on Secret Manager
###############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: gcs-credentials
  namespace: elastic-stack
  labels:
    app.kubernetes.io/part-of: elastic-stack
type: Opaque
data:
  gcs.client.default.credentials_file: "REPLACE_WITH_BASE64_ENCODED_SA_KEY_JSON"
